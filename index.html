<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ゴミ収集記録アプリ</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#333333">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 6px;
    text-align: center;
  }
  .tagline {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #c0392b;
    margin: 0 0 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 480px;
    margin: 0 auto;
  }
  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px 8px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    min-height: 100px;
  }
  a.card.disabled {
    opacity: 0.55;
    pointer-events: none;
  }
  .card small {
    font-weight: 400;
    font-size: 11px;
    opacity: 0.85;
  }
  .footer {
    max-width: 480px;
    margin: 28px auto 0;
    text-align: center;
  }
  .version-tag {
    font-size: 12px;
    color: #888;
    margin: 0 0 10px;
    font-family: ui-monospace, "SFMono-Regular", monospace;
  }
  #updateBtn {
    padding: 10px 20px;
    border: 1px solid #999;
    border-radius: 8px;
    background: #fff;
    color: #333;
    font-size: 13px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #updateBtn:active {
    background: #eee;
  }
  .admin-addr-box {
    margin: 0 0 14px;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 12px;
    color: #555;
  }
  .admin-addr-box code {
    display: block;
    margin: 4px 0 8px;
    font-size: 13px;
    color: #222;
    font-family: ui-monospace, "SFMono-Regular", monospace;
    word-break: break-all;
  }
  #editAdminBtn {
    padding: 6px 14px;
    border: 1px solid #999;
    border-radius: 7px;
    background: #f5f5f5;
    color: #333;
    font-size: 12px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-box {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    max-width: 340px;
    width: 100%;
  }
  .modal-box p { margin: 0 0 10px; font-size: 14px; }
  .modal-box input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 700;
  }
  .modal-btn-cancel { background: #eee; color: #333; }
  .modal-btn-ok { background: #4b2e83; color: #fff; }
</style>
</head>
<body>
<h1>コースを選んでください</h1>
<p class="tagline">今日も一日安全運転・安全作業！</p>
<div class="grid">
  <a class="card" style="background:#4b2e83" href="murasaki/">紫コース</a>
  <a class="card" style="background:#2e7d32" href="midori/">緑コース</a>
  <a class="card" style="background:#b8860b" href="kiiro/">黄コース</a>
  <a class="card" style="background:#1565c0" href="ao/">青コース</a>
  <a class="card" style="background:#2b2b2b" href="kuro/">黒コース</a>
  <a class="card" style="background:#d6336c" href="pink/">ピンクコース</a>
</div>
<div class="footer">
  <div class="admin-addr-box">
    アップロード先
    <code id="adminAddrText">未設定</code>
    <button id="editAdminBtn">編集</button>
  </div>
  <p class="version-tag" id="versionTag"></p>
  <button id="updateBtn">最新版に更新する</button>
</div>
<script>
const TOP_VERSION = "v0.24";
document.getElementById("versionTag").textContent = TOP_VERSION;

const ADMIN_PRESETS = [
  { label: "常務のPC", url: "https://192.168.11.34:8788" },
  { label: "みんなのPC", url: "https://192.168.11.16:8788" }
];

function getAdminServer(){
  try { return localStorage.getItem("gomi_admin_server") || ""; } catch (e) { return ""; }
}
function setAdminServer(v){
  try { localStorage.setItem("gomi_admin_server", v); } catch (e) {}
}
function renderAdminAddr(){
  const addr = getAdminServer();
  const preset = ADMIN_PRESETS.find(p => p.url === addr);
  document.getElementById("adminAddrText").textContent = preset ? preset.label : (addr || "未設定");
}
renderAdminAddr();

const ADMIN_PIN = "0325";

function askPin(onSuccess){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box";
  const p = document.createElement("p");
  p.textContent = "管理者用の暗証番号を入力してください";
  const input = document.createElement("input");
  input.type = "tel";
  input.inputMode = "numeric";
  input.placeholder = "暗証番号";
  const err = document.createElement("p");
  err.style.color = "#c0392b";
  err.style.fontSize = "12px";
  err.style.margin = "-8px 0 10px";
  err.style.display = "none";
  err.textContent = "暗証番号が違います。";
  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "modal-btn-cancel";
  cancelBtn.textContent = "キャンセル";
  cancelBtn.addEventListener("click", () => overlay.remove());
  const okBtn = document.createElement("button");
  okBtn.className = "modal-btn-ok";
  okBtn.textContent = "確認";
  okBtn.addEventListener("click", () => {
    if (input.value === ADMIN_PIN) {
      overlay.remove();
      onSuccess();
    } else {
      err.style.display = "block";
      input.value = "";
      input.focus();
    }
  });
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(input);
  box.appendChild(err);
  box.appendChild(actions);
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  input.focus();
}

function openAdminEditModal(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box";
  const p = document.createElement("p");
  p.textContent = "アップロード先を選んでください";
  const select = document.createElement("select");
  select.style.width = "100%";
  select.style.padding = "10px";
  select.style.fontSize = "16px";
  select.style.marginBottom = "8px";
  select.style.borderRadius = "8px";
  ADMIN_PRESETS.forEach(preset => {
    const opt = document.createElement("option");
    opt.value = preset.url;
    opt.textContent = preset.label;
    select.appendChild(opt);
  });
  const otherOpt = document.createElement("option");
  otherOpt.value = "__other__";
  otherOpt.textContent = "その他（手入力）";
  select.appendChild(otherOpt);

  const customInput = document.createElement("input");
  customInput.type = "text";
  customInput.placeholder = "例: https://192.168.1.50:8788";

  const currentAddr = getAdminServer();
  const matchedPreset = ADMIN_PRESETS.find(preset => preset.url === currentAddr);
  if (matchedPreset) {
    select.value = matchedPreset.url;
    customInput.style.display = "none";
    customInput.value = currentAddr;
  } else {
    select.value = "__other__";
    customInput.style.display = "block";
    customInput.value = currentAddr;
  }
  select.addEventListener("change", () => {
    customInput.style.display = select.value === "__other__" ? "block" : "none";
    if (select.value === "__other__") customInput.focus();
  });

  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "modal-btn-cancel";
  cancelBtn.textContent = "キャンセル";
  cancelBtn.addEventListener("click", () => overlay.remove());
  const okBtn = document.createElement("button");
  okBtn.className = "modal-btn-ok";
  okBtn.textContent = "保存";
  okBtn.addEventListener("click", () => {
    const value = select.value === "__other__" ? customInput.value.trim() : select.value;
    setAdminServer(value);
    renderAdminAddr();
    overlay.remove();
  });
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(select);
  box.appendChild(customInput);
  box.appendChild(actions);
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

document.getElementById("editAdminBtn").addEventListener("click", () => {
  askPin(openAdminEditModal);
});

try {
  if (sessionStorage.getItem("gomi_just_updated") === "1") {
    sessionStorage.removeItem("gomi_just_updated");
    const msg = document.createElement("p");
    msg.textContent = "更新されました。";
    msg.style.color = "#2c8c3f";
    msg.style.fontWeight = "700";
    msg.style.fontSize = "13px";
    msg.style.margin = "0 0 10px";
    document.getElementById("versionTag").insertAdjacentElement("afterend", msg);
  }
} catch (e) {}

const ALL_COLORS = ["murasaki", "midori", "kiiro", "ao", "kuro", "pink"];
const ALL_SCHEDULES = ["getsumoku", "kakin", "pet1", "pet2"];

async function precacheAllCourses(){
  if (!navigator.onLine || !("serviceWorker" in navigator)) return;
  const jobs = [];
  ALL_COLORS.forEach((color) => {
    jobs.push(navigator.serviceWorker.register(color + "/sw.js", { scope: color + "/" }).catch(() => {}));
    ALL_SCHEDULES.forEach((schedule) => {
      jobs.push(
        navigator.serviceWorker
          .register(color + "/" + schedule + "/sw.js", { scope: color + "/" + schedule + "/" })
          .catch(() => {})
      );
    });
  });
  await Promise.all(jobs);
  try { localStorage.setItem("gomi_precache_date", new Date().toDateString()); } catch (e) {}
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    let last = null;
    try { last = localStorage.getItem("gomi_precache_date"); } catch (e) {}
    if (last !== new Date().toDateString()) {
      precacheAllCourses();
    }
  });
}

document.getElementById("updateBtn").addEventListener("click", async () => {
  const btn = document.getElementById("updateBtn");
  const originalText = btn.textContent;
  if (!navigator.onLine) {
    btn.textContent = "オンラインの時に押してください";
    setTimeout(() => { btn.textContent = originalText; }, 3000);
    return;
  }
  btn.textContent = "更新中...";
  btn.disabled = true;
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  try { localStorage.removeItem("gomi_precache_date"); } catch (e) {}
  try { sessionStorage.setItem("gomi_just_updated", "1"); } catch (e) {}
  location.reload();
});
</script>
</body>
</html>
