<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ゴミ収集記録アプリ</title>
<link rel="icon" href="murasaki/icon.png">
<meta name="theme-color" content="#333333">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 6px;
    text-align: center;
  }
  .tagline {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #c0392b;
    margin: 0 0 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 480px;
    margin: 0 auto;
  }
  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px 8px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    min-height: 100px;
  }
  a.card.disabled {
    opacity: 0.55;
    pointer-events: none;
  }
  .card small {
    font-weight: 400;
    font-size: 11px;
    opacity: 0.85;
  }
  .footer {
    max-width: 480px;
    margin: 28px auto 0;
    text-align: center;
  }
  .version-tag {
    font-size: 12px;
    color: #888;
    margin: 0 0 10px;
    font-family: ui-monospace, "SFMono-Regular", monospace;
  }
  #updateBtn {
    padding: 10px 20px;
    border: 1px solid #999;
    border-radius: 8px;
    background: #fff;
    color: #333;
    font-size: 13px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #updateBtn:active {
    background: #eee;
  }
</style>
</head>
<body>
<h1>コースを選んでください</h1>
<p class="tagline">今日も一日安全運転・安全作業！</p>
<div class="grid">
  <a class="card" style="background:#4b2e83" href="murasaki/">紫コース</a>
  <a class="card disabled" style="background:#2e7d32" href="midori/">緑コース<small>準備中</small></a>
  <a class="card" style="background:#b8860b" href="kiiro/">黄コース</a>
  <a class="card" style="background:#1565c0" href="ao/">青コース</a>
  <a class="card disabled" style="background:#2b2b2b" href="kuro/">黒コース<small>準備中</small></a>
  <a class="card disabled" style="background:#d6336c" href="pink/">ピンクコース<small>準備中</small></a>
</div>
<div class="footer">
  <p class="version-tag" id="versionTag"></p>
  <button id="updateBtn">最新版に更新する</button>
</div>
<script>
const TOP_VERSION = "v0.14";
document.getElementById("versionTag").textContent = "バージョン " + TOP_VERSION;

try {
  if (sessionStorage.getItem("gomi_just_updated") === "1") {
    sessionStorage.removeItem("gomi_just_updated");
    const msg = document.createElement("p");
    msg.textContent = "更新されました。";
    msg.style.color = "#2c8c3f";
    msg.style.fontWeight = "700";
    msg.style.fontSize = "13px";
    msg.style.margin = "0 0 10px";
    document.getElementById("versionTag").insertAdjacentElement("afterend", msg);
  }
} catch (e) {}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

document.getElementById("updateBtn").addEventListener("click", async () => {
  const btn = document.getElementById("updateBtn");
  const originalText = btn.textContent;
  if (!navigator.onLine) {
    btn.textContent = "オンラインの時に押してください";
    setTimeout(() => { btn.textContent = originalText; }, 3000);
    return;
  }
  btn.textContent = "更新中...";
  btn.disabled = true;
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  try { sessionStorage.setItem("gomi_just_updated", "1"); } catch (e) {}
  location.reload();
});
</script>
</body>
</html>
