<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ゴミ収集記録アプリ</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#333333">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #ffffff;
    color: #221f28;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 20px;
  }
  h1 {
    font-size: 26px;
    font-weight: 900;
    line-height: 1.25;
    max-width: 480px;
    margin: 0 auto 14px;
    padding-right: 56px;
  }
  .tagline {
    max-width: 480px;
    margin: 0 auto 16px;
    padding: 10px 14px;
    border-radius: 12px;
    background: #fdecea;
    text-align: left;
    font-size: 15px;
    font-weight: 700;
    color: #b4341a;
  }
  .grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 480px;
    margin: 0 auto;
  }
  /* 左の色帯は、インラインのbackground色を残したまま右側を白で塗りつぶして表現している。
     管理ツールがこのaタグの文字列を書き換えるため、HTML側の構造は変えないこと。 */
  a.card {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 60px;
    padding: 8px 40px 8px 74px;
    border: 1px solid #e6e2ec;
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: #221f28;
    font-weight: 700;
    font-size: 19px;
    background-image: linear-gradient(#ffffff, #ffffff) !important;
    background-size: calc(100% - 58px) 100% !important;
    background-position: right center !important;
    background-repeat: no-repeat !important;
  }
  a.card .mark {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 22px;
    font-weight: 900;
  }
  a.card .mark.long { font-size: 15px; letter-spacing: -0.02em; }
  a.card .mark.vert { writing-mode: vertical-rl; text-orientation: upright; font-size: 16px; line-height: 1; }
  a.card::after {
    content: "\203A";
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #a29cad;
    font-size: 26px;
    font-weight: 700;
  }
  a.card .mark { text-shadow: 0 1px 3px rgba(0,0,0,0.45); }
  a.card.disabled {
    opacity: 0.55;
    pointer-events: none;
  }
  .card small {
    margin-left: 8px;
    font-weight: 400;
    font-size: 12px;
    color: #6b6676;
  }
  .footer {
    max-width: 480px;
    margin: 28px auto 0;
    text-align: center;
  }
  .version-tag {
    font-size: 12px;
    color: #888;
    margin: 0 0 10px;
    font-family: ui-monospace, "SFMono-Regular", monospace;
  }
  #updateBtn {
    padding: 10px 20px;
    border: 1px solid #999;
    border-radius: 8px;
    background: #fff;
    color: #333;
    font-size: 13px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #updateBtn:active {
    background: #eee;
  }
  .admin-addr-box {
    margin: 0 0 14px;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 12px;
    color: #555;
  }
  .admin-addr-box code {
    display: block;
    margin: 4px 0 8px;
    font-size: 13px;
    color: #222;
    font-family: ui-monospace, "SFMono-Regular", monospace;
    word-break: break-all;
  }
  #editAdminBtn {
    padding: 6px 14px;
    border: 1px solid #999;
    border-radius: 7px;
    background: #f5f5f5;
    color: #333;
    font-size: 12px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-box {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    max-width: 340px;
    width: 100%;
  }
  .modal-box p { margin: 0 0 10px; font-size: 14px; }
  .modal-box input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 700;
  }
  .modal-btn-cancel { background: #eee; color: #333; }
  .modal-btn-ok { background: var(--hist-course, #4b2e83); color: #fff; }
  .top-menu-btn {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    width: 42px;
    height: 42px;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: #fff;
    font-size: 20px;
    z-index: 60;
  }
  .top-menu-panel {
    position: fixed;
    top: calc(62px + env(safe-area-inset-top, 0px));
    right: 12px;
    min-width: 250px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    display: none;
    z-index: 60;
  }
  .top-menu-panel.open { display: block; }
  .top-menu-panel .admin-addr-box { margin: 8px 4px; }
  .top-menu-panel #editAdminBtn { width: auto; display: inline-block; padding: 6px 14px; }
  .top-menu-panel button {
    display: block;
    width: 100%;
    padding: 11px 12px;
    border: none;
    border-radius: 7px;
    background: none;
    text-align: left;
    font-size: 15px;
    font-weight: 700;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .top-menu-panel button:active { background: #f3f0f8; }
  .hist-filter-btn {
    width: 100%;
    margin: 0 0 10px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f5f5f5;
    font-size: 14px;
    font-weight: 700;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .hist-filter-btn.on { background: var(--hist-course, #4b2e83); color: #fff; border-color: var(--hist-course, #4b2e83); }
  .hist-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .hist-title-row .hist-title-in-row { flex: 1; min-width: 0; }
  .hist-title-stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .hist-course-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: fit-content;
    padding: 3px 10px 3px 8px;
    border-radius: 20px;
    background: color-mix(in srgb, var(--hist-course, #4b2e83) 15%, white);
    color: var(--hist-course, #4b2e83);
    font-weight: 700;
    font-size: 12px;
  }
  .hist-course-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hist-course, #4b2e83); flex: none; }
  .hist-title-stack .hist-title-in-row { margin: 0; }
  .hist-title-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .hist-violation-total { font-size: 12px; font-weight: 700; color: #b4341a; }
  .hist-trash-btn {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    border: 1px solid #e4e0ec;
    background: #fbe4e4;
    color: #b4341a;
    font-size: 16px;
    display: grid;
    place-items: center;
  }
  .hist-undo-toast {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: 400px;
    margin: 0 auto;
    background: #2a2630;
    color: #fff;
    padding: 12px 14px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    z-index: 200;
  }
  .hist-undo-toast button {
    flex: none;
    background: #fff;
    color: #2a2630;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-weight: 700;
    font-size: 13px;
  }
  .modal-btn-danger { background: #b4341a; color: #fff; }
  .hist-box { max-width: 420px; max-height: 80vh; overflow-y: auto; }
  .hist-title { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
  .hist-note { font-size: 12px; color: #777; margin: 0 0 10px; }
  .hist-list, .hist-detail {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
    max-height: 55vh;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 8px;
  }
  .hist-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-item-name { font-weight: 700; font-size: 15px; }
  .hist-item-sub { font-size: 12px; color: #666; white-space: nowrap; }
  .hist-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 6px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .hist-row:last-child { border-bottom: none; }
  .hist-row .h-info { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .hist-row .h-no { flex: none; min-width: 16px; text-align: right; font-size: 12px; font-weight: 700; color: #999; font-variant-numeric: tabular-nums; }
  .hist-row .h-target { min-width: 0; }
  .hist-row .h-target small { color: #777; font-size: 12px; }
  .hist-row .h-time-wrap { display: flex; flex-direction: column; align-items: flex-end; flex: none; }
  .hist-row .h-time { font-weight: 700; color: #000; }
  .hist-row .h-vehicle { font-size: 11px; color: #000; font-weight: 700; }
  .hist-row.h-violation { background: #fbe4e4; }
  .hist-row .h-violation-count {
    color: #b4341a;
    font-size: 12px;
    font-weight: 700;
    flex: none;
    min-width: 62px;
    text-align: center;
    white-space: nowrap;
  }
  .hist-row .h-violation-count.is-empty { visibility: hidden; }
  .hist-mode-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .hist-mode-toggle button {
    flex: 1;
    padding: 9px 10px;
    border: 1px solid #e4e0ec;
    border-radius: 8px;
    background: #f5f5f5;
    color: #22202a;
    font-weight: 700;
    font-size: 13px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .hist-mode-toggle button.on { background: var(--hist-course, #4b2e83); border-color: var(--hist-course, #4b2e83); color: #fff; }
  /* 横向き（iPad）：コースを4列×2段のタイルにして、画面の幅を使い切る */
  @media (orientation: landscape) and (min-width: 700px) {
    body { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
    h1 { max-width: 1100px; font-size: 28px; margin-bottom: 10px; }
    .tagline { max-width: 1100px; margin-bottom: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      max-width: 1100px;
    }
    a.card {
      min-height: 120px;
      padding: 10px 34px 10px 82px;
      font-size: 21px;
      line-height: 1.3;
      background-size: calc(100% - 66px) 100% !important;
    }
    a.card .mark { width: 66px; font-size: 28px; }
    a.card .mark.long { font-size: 17px; }
    a.card .mark.vert { font-size: 24px; }
    a.card::after { right: 12px; }
    .footer { max-width: 1100px; margin-top: 16px; }
  }
</style>
</head>
<body>
<button id="topMenuBtn" class="top-menu-btn" aria-label="メニュー">☰</button>
<div id="topMenuPanel" class="top-menu-panel">
  <button id="topHistoryBtn">過去の記録</button>
  <button id="unsentBtn">未送信データの確認</button>
  <div class="admin-addr-box">
    アップロード先
    <code id="adminAddrText">未設定</code>
    <button id="editAdminBtn">編集</button>
  </div>
  <button id="updateBtn">最新版に更新する</button>
</div>
<h1>コースを選んでください</h1>
<p class="tagline">今日も一日安全運転・安全作業！</p>
<div class="grid">
  <a class="card" style="background:#4b2e83" href="murasaki/"><span class="mark">紫</span>コース</a>
  <a class="card" style="background:#2e7d32" href="midori/"><span class="mark">緑</span>コース</a>
  <a class="card" style="background:#ffc83d" href="kiiro/"><span class="mark">黄</span>コース</a>
  <a class="card" style="background:#1565c0" href="ao/"><span class="mark">青</span>コース</a>
  <a class="card" style="background:#2b2b2b" href="kuro/"><span class="mark">黒</span>コース</a>
  <a class="card" style="background:#d6336c" href="pink/"><span class="mark vert">ピンク</span>コース</a>
  <a class="card" style="background:#7c4dbd" href="youpura_murasaki/"><span class="mark vert">容プラ</span>コース</a>
  <a class="card" style="background:#f2a900" href="youpura_kiiro/"><span class="mark vert">容プラ</span>コース</a>
</div>
<div class="footer">
  <p class="version-tag" id="versionTag"></p>
</div>
<script>
const TOP_VERSION = "v5.0";
document.getElementById("versionTag").textContent = TOP_VERSION;

const ADMIN_PRESETS = [
  { label: "常務のPC", url: "https://192.168.11.34:8788" },
  { label: "みんなのPC", url: "https://192.168.11.16:8788" }
];

function getAdminServer(){
  try { return localStorage.getItem("gomi_admin_server") || ""; } catch (e) { return ""; }
}
function setAdminServer(v){
  try { localStorage.setItem("gomi_admin_server", v); } catch (e) {}
}
function renderAdminAddr(){
  const addr = getAdminServer();
  const preset = ADMIN_PRESETS.find(p => p.url === addr);
  document.getElementById("adminAddrText").textContent = preset ? preset.label : (addr || "未設定");
}
renderAdminAddr();

const ADMIN_PIN = "0325";

function askPin(onSuccess){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box";
  const p = document.createElement("p");
  p.textContent = "管理者用の暗証番号を入力してください";
  const input = document.createElement("input");
  input.type = "tel";
  input.inputMode = "numeric";
  input.placeholder = "暗証番号";
  const err = document.createElement("p");
  err.style.color = "#c0392b";
  err.style.fontSize = "12px";
  err.style.margin = "-8px 0 10px";
  err.style.display = "none";
  err.textContent = "暗証番号が違います。";
  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "modal-btn-cancel";
  cancelBtn.textContent = "キャンセル";
  cancelBtn.addEventListener("click", () => overlay.remove());
  const okBtn = document.createElement("button");
  okBtn.className = "modal-btn-ok";
  okBtn.textContent = "確認";
  okBtn.addEventListener("click", () => {
    if (input.value === ADMIN_PIN) {
      overlay.remove();
      onSuccess();
    } else {
      err.style.display = "block";
      input.value = "";
      input.focus();
    }
  });
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(input);
  box.appendChild(err);
  box.appendChild(actions);
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  input.focus();
}

function openAdminEditModal(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box";
  const p = document.createElement("p");
  p.textContent = "アップロード先を選んでください";
  const select = document.createElement("select");
  select.style.width = "100%";
  select.style.padding = "10px";
  select.style.fontSize = "16px";
  select.style.marginBottom = "8px";
  select.style.borderRadius = "8px";
  ADMIN_PRESETS.forEach(preset => {
    const opt = document.createElement("option");
    opt.value = preset.url;
    opt.textContent = preset.label;
    select.appendChild(opt);
  });
  const otherOpt = document.createElement("option");
  otherOpt.value = "__other__";
  otherOpt.textContent = "その他（手入力）";
  select.appendChild(otherOpt);

  const customInput = document.createElement("input");
  customInput.type = "text";
  customInput.placeholder = "例: https://192.168.1.50:8788";

  const currentAddr = getAdminServer();
  const matchedPreset = ADMIN_PRESETS.find(preset => preset.url === currentAddr);
  if (matchedPreset) {
    select.value = matchedPreset.url;
    customInput.style.display = "none";
    customInput.value = currentAddr;
  } else {
    select.value = "__other__";
    customInput.style.display = "block";
    customInput.value = currentAddr;
  }
  select.addEventListener("change", () => {
    customInput.style.display = select.value === "__other__" ? "block" : "none";
    if (select.value === "__other__") customInput.focus();
  });

  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "modal-btn-cancel";
  cancelBtn.textContent = "キャンセル";
  cancelBtn.addEventListener("click", () => overlay.remove());
  const okBtn = document.createElement("button");
  okBtn.className = "modal-btn-ok";
  okBtn.textContent = "保存";
  okBtn.addEventListener("click", () => {
    const value = select.value === "__other__" ? customInput.value.trim() : select.value;
    setAdminServer(value);
    renderAdminAddr();
    overlay.remove();
  });
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(select);
  box.appendChild(customInput);
  box.appendChild(actions);
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

document.getElementById("editAdminBtn").addEventListener("click", () => {
  askPin(openAdminEditModal);
});

try {
  if (sessionStorage.getItem("gomi_just_updated") === "1") {
    sessionStorage.removeItem("gomi_just_updated");
    const msg = document.createElement("p");
    msg.textContent = "更新されました。";
    msg.style.color = "#2c8c3f";
    msg.style.fontWeight = "700";
    msg.style.fontSize = "13px";
    msg.style.margin = "0 0 10px";
    document.getElementById("versionTag").insertAdjacentElement("afterend", msg);
  }
} catch (e) {}

const COURSE_SCHEDULES = {
  murasaki: ["getsumoku", "kakin", "pet1", "pet2"],
  midori: ["getsumoku", "kakin", "pet1", "pet2"],
  kiiro: ["getsumoku", "kakin", "kanada", "pet1", "pet2"],
  ao: ["getsumoku", "kakin", "pet1", "pet2"],
  kuro: ["getsumoku", "kakin", "pet1", "pet2"],
  pink: ["getsumoku", "kakin", "pet1", "pet2"],
  youpura_murasaki: ["kanada", "sakuyama", "nishi", "higashi"],
  youpura_kiiro: ["kanada", "sakuyama", "nishi", "higashi"]
};

async function precacheAllCourses(){
  if (!navigator.onLine || !("serviceWorker" in navigator)) return;
  const jobs = [];
  Object.keys(COURSE_SCHEDULES).forEach((color) => {
    jobs.push(navigator.serviceWorker.register(color + "/sw.js", { scope: color + "/" }).catch(() => {}));
    COURSE_SCHEDULES[color].forEach((schedule) => {
      jobs.push(
        navigator.serviceWorker
          .register(color + "/" + schedule + "/sw.js", { scope: color + "/" + schedule + "/" })
          .catch(() => {})
      );
    });
  });
  await Promise.all(jobs);
  try { localStorage.setItem("gomi_precache_date", new Date().toDateString()); } catch (e) {}
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    let last = null;
    try { last = localStorage.getItem("gomi_precache_date"); } catch (e) {}
    if (last !== new Date().toDateString()) {
      precacheAllCourses();
    }
  });
}

const HIST_CACHE_KEY = "gomi_history_cache";

function histArr(v){ return Array.isArray(v) ? v : (v ? [v] : []); }

function histRow(r){
  return {
    no: r["番号"],
    st: r["ST番号"],
    map: r["地図番号"],
    target: r["目標物"],
    time: r["収集時刻"] || "",
    violation: r["違反ゴミ個数"] || "",
    vehicle: r["車両番号"] || "",
    hasCardboardCols: Object.prototype.hasOwnProperty.call(r, "ダンボール回収時刻"),
    cardboardTime: r["ダンボール回収時刻"] || "",
    cardboardViolation: r["ダンボール違反ゴミ個数"] || ""
  };
}

function histVehiclesOf(rows){
  const list = [...new Set(rows.map(r => r.vehicle).filter(v => v))];
  return list.join("・");
}

function histCourseRank(name){
  const s = histShortName(name);
  if (s.includes("月・木")) return 0;
  if (s.includes("火・金")) return 1;
  return s.includes("②") ? 3 : 2;
}

function histShortName(name){
  const m = String(name).match(/（(.+)）/);
  return m ? m[1] : String(name);
}

function histDateLabel(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const w = ["日","月","火","水","木","金","土"];
  return (d.getMonth() + 1) + "/" + d.getDate() + "（" + w[d.getDay()] + "）";
}

function formatHistSavedAt(iso){
  const d = new Date(iso);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function saveHistCache(days){
  try {
    localStorage.setItem(HIST_CACHE_KEY, JSON.stringify({
      savedAt: new Date().toISOString(),
      days: days.map(d => ({
        dateStr: d.dateStr,
        courses: d.courses.map(c => ({ color: c.color, name: c.name, rows: c.rows }))
      }))
    }));
  } catch (e) {}
}

function loadHistCache(){
  try { return JSON.parse(localStorage.getItem(HIST_CACHE_KEY) || "null"); } catch (e) { return null; }
}

async function fetchAllHistory(){
  const server = getAdminServer();
  if (server) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 6000);
    try {
      const base = (server.startsWith("http") ? server : "http://" + server).replace(/\/$/, "");
      const res = await fetch(base + "/api/history", { signal: controller.signal });
      const data = await res.json();
      if (res.ok && !data.error) {
        const days = histArr(data.days).map(day => ({
          dateStr: day.date,
          courses: histArr(day.courses).map(c => ({
            color: c.color,
            name: c.name,
            rows: histArr(c.rows).map(histRow)
          }))
        }));
        saveHistCache(days);
        return { days, fromServer: true, savedAt: null };
      }
    } catch (e) {
    } finally {
      clearTimeout(timeoutId);
    }
  }
  const cache = loadHistCache();
  if (cache && cache.days) return { days: cache.days, fromServer: false, savedAt: cache.savedAt };
  return null;
}

const HIST_COLOR_ORDER = ["紫", "緑", "黄", "青", "黒", "ピンク", "容プラ(紫)", "容プラ(黄)"];
const HIST_COLOR_HEX = {
  "紫": "#4b2e83",
  "緑": "#2e7d32",
  "黄": "#ffc83d",
  "青": "#1565c0",
  "黒": "#2b2b2b",
  "ピンク": "#d6336c",
  "容プラ(紫)": "#7c4dbd",
  "容プラ(黄)": "#f2a900"
};

function buildHistGroups(days){
  const map = new Map();
  days.forEach(day => day.courses.forEach(c => {
    if (!c.rows.some(r => r.time || r.violation)) return;
    const key = c.color + "|" + c.name;
    if (!map.has(key)) map.set(key, { color: c.color, name: c.name, days: [] });
    map.get(key).days.push({ dateStr: day.dateStr, rows: c.rows });
  }));
  const groups = [...map.values()];
  groups.forEach(g => g.days.sort((a, b) => (a.dateStr < b.dateStr ? 1 : -1)));
  groups.sort((a, b) => {
    const ra = HIST_COLOR_ORDER.indexOf(a.color), rb = HIST_COLOR_ORDER.indexOf(b.color);
    if (ra !== rb) return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb);
    if (a.color !== b.color) return a.color.localeCompare(b.color, "ja");
    return histCourseRank(a.name) - histCourseRank(b.name);
  });
  return groups;
}

function renderHistColorList(overlay, box, result){
  box.innerHTML = "";
  box.style.borderTop = "";
  box.style.removeProperty("--hist-course");
  box.appendChild(histTitle("過去の記録（直近14日）"));
  box.appendChild(histNote(result.fromServer
    ? "管理PCに保存された全コースの記録です。"
    : "管理PCに接続できないため、最後に取得した記録（" + formatHistSavedAt(result.savedAt) + "時点）です。"));
  const groups = buildHistGroups(result.days);
  if (groups.length === 0) {
    box.appendChild(histNote("過去14日分の記録はありません。"));
  } else {
    const byColor = new Map();
    groups.forEach(g => {
      if (!byColor.has(g.color)) byColor.set(g.color, []);
      byColor.get(g.color).push(g);
    });
    const ul = document.createElement("ul");
    ul.className = "hist-list";
    byColor.forEach((gs, color) => {
      const dayCount = new Set(gs.flatMap(g => g.days.map(d => d.dateStr))).size;
      ul.appendChild(histListItem(color, dayCount + "日分 ›", () => renderHistColorDays(overlay, box, result, color, gs)));
    });
    box.appendChild(ul);
  }
  box.appendChild(histActions(overlay, null));
}

function renderHistColorDays(overlay, box, result, color, groups, topLevel){
  box.innerHTML = "";
  box.style.borderTop = "";
  box.style.removeProperty("--hist-course");
  box.appendChild(histTitle(color));
  box.appendChild(histNote("日付をタップすると、その日の記録を見られます。"));
  const byDate = new Map();
  groups.forEach(g => g.days.forEach(day => {
    if (!byDate.has(day.dateStr)) byDate.set(day.dateStr, []);
    byDate.get(day.dateStr).push({ group: g, day });
  }));
  const dates = [...byDate.keys()].sort((a, b) => (a < b ? 1 : -1));
  const ul = document.createElement("ul");
  ul.className = "hist-list";
  dates.forEach(dateStr => {
    const items = byDate.get(dateStr);
    const vehicles = histVehiclesOf(items.flatMap(it => it.day.rows));
    const sub = (vehicles ? "車両 " + vehicles + "　" : "") + items.length + "コース ›";
    ul.appendChild(histListItem(histDateLabel(dateStr), sub, () => {
      if (items.length === 1) {
        renderHistDayDetail(overlay, box, result, items[0].group, items[0].day,
          () => renderHistColorDays(overlay, box, result, color, groups, topLevel));
      } else {
        renderHistDateCourses(overlay, box, result, color, groups, dateStr, items, topLevel);
      }
    }));
  });
  box.appendChild(ul);
  box.appendChild(histActions(overlay, topLevel ? null : (() => renderHistColorList(overlay, box, result))));
}

function renderHistDateCourses(overlay, box, result, color, groups, dateStr, items, topLevel){
  box.innerHTML = "";
  box.style.borderTop = "";
  box.style.removeProperty("--hist-course");
  box.appendChild(histTitle(histDateLabel(dateStr) + "　" + color));
  const ul = document.createElement("ul");
  ul.className = "hist-list";
  items.forEach(({ group, day }) => {
    const done = day.rows.filter(r => r.time).length;
    const vehicles = histVehiclesOf(day.rows);
    ul.appendChild(histListItem(
      histShortName(group.name),
      (vehicles ? "車両 " + vehicles + "　" : "") + done + " / " + day.rows.length + " 件完了 ›",
      () => renderHistDayDetail(overlay, box, result, group, day,
        () => renderHistDateCourses(overlay, box, result, color, groups, dateStr, items, topLevel))
    ));
  });
  box.appendChild(ul);
  box.appendChild(histActions(overlay, () => renderHistColorDays(overlay, box, result, color, groups, topLevel)));
}

function renderHistDayDetail(overlay, box, result, group, day, onBack){
  box.innerHTML = "";
  const courseHex = HIST_COLOR_HEX[group.color] || "#4b2e83";
  box.style.setProperty("--hist-course", courseHex);
  box.style.borderTop = "4px solid " + courseHex;

  const titleRow = document.createElement("div");
  titleRow.className = "hist-title-row";
  const titleStack = document.createElement("div");
  titleStack.className = "hist-title-stack";
  const chip = document.createElement("span");
  chip.className = "hist-course-chip";
  chip.innerHTML = '<span class="dot"></span>' + group.color + "　" + histShortName(group.name);
  const titleLine = document.createElement("div");
  titleLine.className = "hist-title-line";
  const titleEl = histTitle(histDateLabel(day.dateStr) + "の記録");
  titleEl.classList.add("hist-title-in-row");
  const violationTotalEl = document.createElement("span");
  violationTotalEl.className = "hist-violation-total";
  titleLine.appendChild(titleEl);
  titleLine.appendChild(violationTotalEl);
  titleStack.appendChild(chip);
  titleStack.appendChild(titleLine);
  const trashBtn = document.createElement("button");
  trashBtn.className = "hist-trash-btn";
  trashBtn.setAttribute("aria-label", "この日の記録を削除");
  trashBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
  trashBtn.addEventListener("click", () => {
    confirmHistDelete(() => deleteHistDay(overlay, box, result, group, day));
  });
  titleRow.appendChild(titleStack);
  titleRow.appendChild(trashBtn);
  box.appendChild(titleRow);

  const isCardboard = day.rows.some(r => r.hasCardboardCols);
  let mode = "pet";
  let onlyViolation = false;

  function recOf(r){
    return mode === "box"
      ? { time: r.cardboardTime, violation: r.cardboardViolation }
      : { time: r.time, violation: r.violation };
  }

  const filterBtn = document.createElement("button");
  filterBtn.className = "hist-filter-btn";
  const ul = document.createElement("ul");
  ul.className = "hist-detail";

  function renderRows(){
    if (isCardboard) ul.dataset.mode = mode;
    filterBtn.textContent = onlyViolation ? "すべて表示に戻す" : "違反ステーションだけ表示";
    filterBtn.classList.toggle("on", onlyViolation);
    const total = day.rows.reduce((sum, r) => sum + (parseInt(recOf(r).violation, 10) || 0), 0);
    violationTotalEl.textContent = total > 0 ? ("違反 計" + total + "個") : "";
    ul.innerHTML = "";
    const rows = day.rows.filter(r => !onlyViolation || recOf(r).violation);
    if (rows.length === 0) {
      const empty = document.createElement("li");
      empty.className = "hist-row";
      empty.textContent = "違反ステーションはありません。";
      ul.appendChild(empty);
    }
    rows.forEach(r => {
      const rec = recOf(r);
      const li = document.createElement("li");
      li.className = "hist-row" + (rec.violation ? " h-violation" : "");

      const info = document.createElement("span");
      info.className = "h-info";
      const no = document.createElement("span");
      no.className = "h-no";
      no.textContent = r.no || "";
      const target = document.createElement("span");
      target.className = "h-target";
      target.textContent = r.target || "";
      target.appendChild(document.createElement("br"));
      const small = document.createElement("small");
      small.textContent = (r.map || "") + " / ST" + (r.st || "");
      target.appendChild(small);
      info.appendChild(no);
      info.appendChild(target);
      li.appendChild(info);

      const v = document.createElement("span");
      v.className = "h-violation-count" + (rec.violation ? "" : " is-empty");
      v.textContent = rec.violation ? ("違反" + rec.violation + "個") : "違反なし";
      li.appendChild(v);

      const timeWrap = document.createElement("span");
      timeWrap.className = "h-time-wrap";
      if (r.vehicle) {
        const veh = document.createElement("span");
        veh.className = "h-vehicle";
        veh.textContent = "車両 " + r.vehicle;
        timeWrap.appendChild(veh);
      }
      const time = document.createElement("span");
      time.className = "h-time";
      time.textContent = rec.time || "なし";
      timeWrap.appendChild(time);
      li.appendChild(timeWrap);

      ul.appendChild(li);
    });
  }

  if (isCardboard) {
    const modeToggle = document.createElement("div");
    modeToggle.className = "hist-mode-toggle";
    const petBtn = document.createElement("button");
    petBtn.className = "pet on";
    petBtn.textContent = "ペット";
    const boxBtn = document.createElement("button");
    boxBtn.className = "box";
    boxBtn.textContent = "ダンボール";
    petBtn.addEventListener("click", () => {
      mode = "pet";
      petBtn.classList.add("on");
      boxBtn.classList.remove("on");
      renderRows();
    });
    boxBtn.addEventListener("click", () => {
      mode = "box";
      boxBtn.classList.add("on");
      petBtn.classList.remove("on");
      renderRows();
    });
    modeToggle.appendChild(petBtn);
    modeToggle.appendChild(boxBtn);
    box.appendChild(modeToggle);
  }

  filterBtn.addEventListener("click", () => {
    onlyViolation = !onlyViolation;
    renderRows();
  });
  box.appendChild(filterBtn);
  box.appendChild(ul);
  renderRows();
  box.appendChild(histActions(overlay, onBack));
}

async function deleteHistDay(overlay, box, result, group, day){
  const server = getAdminServer();
  const base = server ? (server.startsWith("http") ? server : "http://" + server).replace(/\/$/, "") : "";
  let data;
  try {
    if (!server) throw new Error("アップロード先が未設定です。");
    const res = await fetch(base + "/api/history-delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ colorLabel: group.color, courseName: group.name, date: day.dateStr })
    });
    data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "削除できませんでした。");
  } catch (e) {
    box.appendChild(histNote("削除できませんでした：" + e.message));
    return;
  }
  result.days = result.days
    .map(d => d.dateStr !== day.dateStr ? d : { ...d, courses: d.courses.filter(c => !(c.color === group.color && c.name === group.name)) })
    .filter(d => d.courses.length > 0);
  pruneHistCache(group, day.dateStr);
  renderHistColorList(overlay, box, result);

  const label = histDateLabel(day.dateStr) + "　" + group.color + " " + histShortName(group.name) + " を削除しました";
  if (data.trashPath && data.originalPath) {
    showHistToast(label, "元に戻す", async () => {
      try {
        const r2 = await fetch(base + "/api/history-restore", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ trashPath: data.trashPath, originalPath: data.originalPath })
        });
        const d2 = await r2.json();
        if (!r2.ok || d2.error) throw new Error(d2.error || "元に戻せませんでした。");
        let dayEntry = result.days.find(d => d.dateStr === day.dateStr);
        if (!dayEntry) {
          dayEntry = { dateStr: day.dateStr, date: day.date, courses: [] };
          result.days.push(dayEntry);
        }
        dayEntry.courses.push({ color: group.color, name: group.name, saved: true, rows: day.rows });
        saveHistCache(result.days);
        renderHistColorList(overlay, box, result);
      } catch (e) {
        showHistToast("元に戻せませんでした：" + e.message, null, null);
      }
    });
  } else {
    showHistToast(label, null, null);
  }
}

function pruneHistCache(group, dateStr){
  const cache = loadHistCache();
  if (!cache || !cache.days) return;
  cache.days = cache.days
    .map(d => d.dateStr !== dateStr ? d : { ...d, courses: d.courses.filter(c => !(c.color === group.color && c.name === group.name)) })
    .filter(d => d.courses.length > 0);
  try { localStorage.setItem(HIST_CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
}
function dateKeyOf(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function collectUnsentDays(){
  let names = {};
  try { names = JSON.parse(localStorage.getItem("gomi_course_names") || "{}"); } catch (e) {}
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 14);
  const todayKey = dateKeyOf(new Date());
  const cutoffKey = dateKeyOf(cutoff);
  const items = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    const m = key.match(/^gomi_(.+)_(\d{4}-\d{2}-\d{2})$/);
    if (!m) continue;
    const courseId = m[1];
    const date = m[2];
    if (/^(saved|v|cb|ct|cv|veh)_/.test(courseId)) continue;
    if (date >= todayKey || date < cutoffKey) continue;
    if (localStorage.getItem("gomi_saved_" + courseId + "_" + date) === "1") continue;
    let recs = {};
    try { recs = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) {}
    if (Object.keys(recs).length === 0) continue;
    items.push({ courseId, date, name: names[courseId] || courseId });
  }
  items.sort((a, b) => (a.date < b.date ? 1 : -1));
  return items;
}

function courseHrefOf(courseId){
  const idx = courseId.indexOf("-");
  return courseId.slice(0, idx) + "/" + courseId.slice(idx + 1) + "/";
}

function openUnsentList(){
  const overlay = document.createElement("div");

    const ul = document.createElement("ul");

      ));

async function openTopHistory(preselectColor){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box hist-box";
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  box.appendChild(histNote("読み込み中..."));

  const result = await fetchAllHistory();
  if (result === null) {
    box.innerHTML = "";
    box.appendChild(histTitle("過去の記録"));
    box.appendChild(histNote("管理PCに接続できず、取得済みの記録もありません。アップロード先を設定して、事務所のWi-Fiでもう一度開いてください。"));
    box.appendChild(histActions(overlay, null));
    return;
  }
  if (preselectColor) {
    const gs = buildHistGroups(result.days).filter(g => g.color === preselectColor);
    if (gs.length > 0) {
      renderHistColorDays(overlay, box, result, preselectColor, gs, true);
      return;
    }
  }
  renderHistColorList(overlay, box, result);
}

document.getElementById("updateBtn").addEventListener("click", async () => {
  const btn = document.getElementById("updateBtn");
  const originalText = btn.textContent;
  if (!navigator.onLine) {
    btn.textContent = "オンラインの時に押してください";
    setTimeout(() => { btn.textContent = originalText; }, 3000);
    return;
  }
  btn.textContent = "更新中...";
  btn.disabled = true;
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  try { localStorage.removeItem("gomi_precache_date"); } catch (e) {}
  try { sessionStorage.setItem("gomi_just_updated", "1"); } catch (e) {}
  location.reload();
});
</script>
</body>
</html>
