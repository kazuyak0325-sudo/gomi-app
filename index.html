<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ゴミ収集記録アプリ</title>
<link rel="icon" href="murasaki/icon.png">
<meta name="theme-color" content="#333333">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 6px;
    text-align: center;
  }
  .tagline {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #c0392b;
    margin: 0 0 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 480px;
    margin: 0 auto;
  }
  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px 8px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    min-height: 100px;
  }
  a.card.disabled {
    opacity: 0.55;
    pointer-events: none;
  }
  .card small {
    font-weight: 400;
    font-size: 11px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<h1>コースを選んでください</h1>
<p class="tagline">今日も一日安全運転・安全作業！</p>
<div class="grid">
  <a class="card" style="background:#4b2e83" href="murasaki/">紫コース<small>金丸・奥沢</small></a>
  <a class="card disabled" style="background:#2e7d32" href="midori/">緑コース<small>準備中</small></a>
  <a class="card disabled" style="background:#b8860b" href="kiiro/">黄コース<small>準備中</small></a>
  <a class="card disabled" style="background:#1565c0" href="ao/">青コース<small>準備中</small></a>
  <a class="card disabled" style="background:#2b2b2b" href="kuro/">黒コース<small>準備中</small></a>
  <a class="card disabled" style="background:#d6336c" href="pink/">ピンクコース<small>準備中</small></a>
</div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
