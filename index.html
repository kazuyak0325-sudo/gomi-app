<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-done: #e3f6e6;
    --border: #e2dfe8;
    --text: #221f28;
    --text-muted: #7a7585;
    --accent: #4b2e83;
    --accent-contrast: #ffffff;
    --danger: #c0392b;
    --danger-contrast: #ffffff;
    --done-text: #2c8c3f;
    --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--accent);
    color: var(--accent-contrast);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  header h1 {
    margin: 0 0 2px;
    font-size: 17px;
    font-weight: 700;
  }
  header .sub {
    margin: 0 0 10px;
    font-size: 12px;
    opacity: 0.85;
  }
  #progress {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    margin-bottom: 8px;
  }
  #filter {
    width: 100%;
    padding: 9px 12px;
    font-size: 15px;
    font-family: var(--font-body);
    border: none;
    border-radius: 8px;
    margin-bottom: 8px;
    background: var(--surface);
    color: var(--text);
  }
  #filter::placeholder { color: var(--text-muted); }
  .actions { display: flex; gap: 8px; }
  .actions button {
    flex: 1;
    padding: 9px 6px;
    font-size: 13px;
    font-family: var(--font-body);
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,0.16);
    color: var(--accent-contrast);
  }
  .actions button:active { background: rgba(255,255,255,0.28); }

  main {
    padding: 16px;
    padding-top: 8px;
    max-width: 720px;
    margin: 0 auto;
  }
  #list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .item {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .item.done { background: var(--surface-done); }
  .item.violation { outline: 2px solid var(--danger); }

  .row-main { display: flex; align-items: center; gap: 4px; }
  .no {
    width: 30px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--text-muted);
    font-size: 13px;
  }
  .target {
    flex: 1;
    font-size: 16px;
    line-height: 1.3;
    padding-right: 8px;
    min-width: 0;
  }
  .target small {
    display: block;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 2px;
  }
  .time {
    width: 64px;
    flex-shrink: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
    font-weight: 700;
    color: var(--text-muted);
  }
  .item.done .time { color: var(--done-text); }

  .violation-row {
    display: flex;
    align-items: center;
    margin-top: 8px;
    gap: 8px;
  }
  .mark-btn, .stepper-btn, .clear-btn {
    font-family: var(--font-body);
    border: 1px solid var(--danger);
    border-radius: 8px;
    background: transparent;
    color: var(--danger);
  }
  .mark-btn { padding: 6px 12px; font-size: 13px; }
  .stepper-btn { width: 34px; height: 30px; font-size: 16px; font-weight: 700; }
  .count-display {
    min-width: 46px;
    text-align: center;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--danger);
    font-size: 14px;
  }
  .clear-btn {
    margin-left: auto;
    padding: 5px 10px;
    font-size: 12px;
    border-color: var(--border);
    color: var(--text-muted);
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    max-width: 360px;
    width: 100%;
  }
  .modal-box p {
    margin: 0 0 14px;
    font-size: 15px;
    line-height: 1.4;
    color: var(--text);
  }
  .modal-textarea {
    width: 100%;
    min-height: 120px;
    margin-bottom: 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-sizing: border-box;
    background: var(--bg);
    color: var(--text);
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-actions button {
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    font-family: var(--font-body);
  }
  .modal-btn-cancel {
    background: var(--border);
    color: var(--text);
  }
  .modal-btn-ok {
    background: var(--danger);
    color: var(--danger-contrast);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 1000;
    max-width: 90%;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>

function todayDateStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function todayKey(){
  return "gomi_" + COURSE_ID + "_" + todayDateStr();
}

function todayViolationKey(){
  return "gomi_v_" + COURSE_ID + "_" + todayDateStr();
}

let records = {};
try {
  records = JSON.parse(localStorage.getItem(todayKey()) || "{}");
} catch (e) {
  records = {};
}

let violations = {};
try {
  violations = JSON.parse(localStorage.getItem(todayViolationKey()) || "{}");
} catch (e) {
  violations = {};
}

function save(){
  try {
    localStorage.setItem(todayKey(), JSON.stringify(records));
  } catch (e) {}
}

function saveViolations(){
  try {
    localStorage.setItem(todayViolationKey(), JSON.stringify(violations));
  } catch (e) {}
}

function fmtTime(d){
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function showConfirm(message, onConfirm){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box";
  const p = document.createElement("p");
  p.textContent = message;
  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "modal-btn-cancel";
  cancelBtn.textContent = "キャンセル";
  cancelBtn.addEventListener("click", () => overlay.remove());
  const okBtn = document.createElement("button");
  okBtn.className = "modal-btn-ok";
  okBtn.textContent = "実行";
  okBtn.addEventListener("click", () => {
    overlay.remove();
    onConfirm();
  });
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(actions);
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function showTextModal(message, text){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box";
  const p = document.createElement("p");
  p.textContent = message;
  const ta = document.createElement("textarea");
  ta.className = "modal-textarea";
  ta.value = text;
  ta.readOnly = true;
  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-btn-cancel";
  closeBtn.textContent = "閉じる";
  closeBtn.addEventListener("click", () => overlay.remove());
  actions.appendChild(closeBtn);
  box.appendChild(p);
  box.appendChild(ta);
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  ta.focus();
  ta.select();
}

function showToast(message){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = message;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => {
    t.classList.remove("show");
    setTimeout(() => t.remove(), 300);
  }, 2500);
}

function mkStepperBtn(label, onClick){
  const b = document.createElement("button");
  b.className = "stepper-btn";
  b.textContent = label;
  b.addEventListener("click", (e) => {
    e.stopPropagation();
    onClick();
  });
  return b;
}

function render(filterText){
  const list = document.getElementById("list");
  list.innerHTML = "";
  let doneCount = 0;
  let violationStations = 0;
  let violationItems = 0;
  const ft = (filterText || "").trim();

  stations.forEach(s => {
    const time = records[s.st];
    const v = violations[s.st];
    if (time) doneCount++;
    if (v) {
      violationStations++;
      violationItems += v.count;
    }
    if (ft && !(s.target.includes(ft) || String(s.st).includes(ft) || String(s.no).includes(ft))) return;

    const li = document.createElement("li");
    li.className = "item" + (time ? " done" : "") + (v ? " violation" : "");

    const rowMain = document.createElement("div");
    rowMain.className = "row-main";
    rowMain.innerHTML =
      '<span class="no">' + s.no + '</span>' +
      '<span class="target">' + s.target + '<small>' + s.map + ' / ST' + s.st + '</small></span>' +
      '<span class="time">' + (time || "--:--") + '</span>';
    rowMain.addEventListener("click", () => onTap(s));
    li.appendChild(rowMain);

    const vRow = document.createElement("div");
    vRow.className = "violation-row";
    if (v) {
      vRow.appendChild(mkStepperBtn("－", () => changeViolationCount(s, -1)));
      const countSpan = document.createElement("span");
      countSpan.className = "count-display";
      countSpan.textContent = v.count + "個";
      vRow.appendChild(countSpan);
      vRow.appendChild(mkStepperBtn("＋", () => changeViolationCount(s, 1)));
      const clearBtn = document.createElement("button");
      clearBtn.className = "clear-btn";
      clearBtn.textContent = "解除";
      clearBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        clearViolation(s);
      });
      vRow.appendChild(clearBtn);
    } else {
      const markBtn = document.createElement("button");
      markBtn.className = "mark-btn";
      markBtn.textContent = "違反ゴミあり";
      markBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        markViolation(s);
      });
      vRow.appendChild(markBtn);
    }
    li.appendChild(vRow);

    list.appendChild(li);
  });

  document.getElementById("progress").textContent =
    doneCount + " / " + stations.length + " 完了　違反ゴミ " + violationStations + "箇所（計" + violationItems + "個）";
}

function onTap(s){
  if (records[s.st]) {
    showConfirm('「' + s.target + '」の記録(' + records[s.st] + ')を取り消しますか？', () => {
      delete records[s.st];
      save();
      render(document.getElementById("filter").value);
    });
    return;
  }
  records[s.st] = fmtTime(new Date());
  save();
  render(document.getElementById("filter").value);
}

function markViolation(s){
  violations[s.st] = { count: 1, time: fmtTime(new Date()) };
  saveViolations();
  render(document.getElementById("filter").value);
}

function changeViolationCount(s, delta){
  const v = violations[s.st];
  if (!v) return;
  v.count = Math.max(1, v.count + delta);
  saveViolations();
  render(document.getElementById("filter").value);
}

function clearViolation(s){
  delete violations[s.st];
  saveViolations();
  render(document.getElementById("filter").value);
}

document.getElementById("filter").addEventListener("input", e => render(e.target.value));

document.getElementById("resetBtn").addEventListener("click", () => {
  showConfirm("今日の記録（収集時刻・違反ゴミ）をすべてリセットしますか？", () => {
    records = {};
    violations = {};
    save();
    saveViolations();
    render(document.getElementById("filter").value);
  });
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const lines = stations.map(s => records[s.st] || "");
  const text = lines.join("\n");
  try {
    await navigator.clipboard.writeText(text);
    showToast("時刻を上から順にコピーしました。Excelの時刻列に貼り付けできます。");
  } catch (e) {
    showTextModal("自動コピーできませんでした。下の内容を手動でコピーしてください:", text);
  }
});

render("");

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
