<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ゴミ収集記録アプリ</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#333333">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 6px;
    text-align: center;
  }
  .tagline {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #c0392b;
    margin: 0 0 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 480px;
    margin: 0 auto;
  }
  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px 8px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    min-height: 100px;
  }
  a.card.disabled {
    opacity: 0.55;
    pointer-events: none;
  }
  .card small {
    font-weight: 400;
    font-size: 11px;
    opacity: 0.85;
  }
  .footer {
    max-width: 480px;
    margin: 28px auto 0;
    text-align: center;
  }
  .version-tag {
    font-size: 12px;
    color: #888;
    margin: 0 0 10px;
    font-family: ui-monospace, "SFMono-Regular", monospace;
  }
  #updateBtn {
    padding: 10px 20px;
    border: 1px solid #999;
    border-radius: 8px;
    background: #fff;
    color: #333;
    font-size: 13px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #updateBtn:active {
    background: #eee;
  }
  .admin-addr-box {
    margin: 0 0 14px;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 12px;
    color: #555;
  }
  .admin-addr-box code {
    display: block;
    margin: 4px 0 8px;
    font-size: 13px;
    color: #222;
    font-family: ui-monospace, "SFMono-Regular", monospace;
    word-break: break-all;
  }
  #editAdminBtn {
    padding: 6px 14px;
    border: 1px solid #999;
    border-radius: 7px;
    background: #f5f5f5;
    color: #333;
    font-size: 12px;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-box {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    max-width: 340px;
    width: 100%;
  }
  .modal-box p { margin: 0 0 10px; font-size: 14px; }
  .modal-box input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 700;
  }
  .modal-btn-cancel { background: #eee; color: #333; }
  .modal-btn-ok { background: #4b2e83; color: #fff; }
  .top-menu-btn {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    width: 42px;
    height: 42px;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: #fff;
    font-size: 20px;
    z-index: 60;
  }
  .top-menu-panel {
    position: fixed;
    top: calc(62px + env(safe-area-inset-top, 0px));
    right: 12px;
    min-width: 250px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    display: none;
    z-index: 60;
  }
  .top-menu-panel.open { display: block; }
  .top-menu-panel .admin-addr-box { margin: 8px 4px; }
  .top-menu-panel #editAdminBtn { width: auto; display: inline-block; padding: 6px 14px; }
  .top-menu-panel button {
    display: block;
    width: 100%;
    padding: 11px 12px;
    border: none;
    border-radius: 7px;
    background: none;
    text-align: left;
    font-size: 15px;
    font-weight: 700;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .top-menu-panel button:active { background: #f3f0f8; }
  .hist-filter-btn {
    width: 100%;
    margin: 0 0 10px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f5f5f5;
    font-size: 14px;
    font-weight: 700;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .hist-filter-btn.on { background: #4b2e83; color: #fff; border-color: #4b2e83; }
  .hist-box { max-width: 420px; max-height: 80vh; overflow-y: auto; }
  .hist-title { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
  .hist-note { font-size: 12px; color: #777; margin: 0 0 10px; }
  .hist-list, .hist-detail {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
    max-height: 55vh;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 8px;
  }
  .hist-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
  }
  .hist-item:last-child { border-bottom: none; }
  .hist-item-name { font-weight: 700; font-size: 15px; }
  .hist-item-sub { font-size: 12px; color: #666; white-space: nowrap; }
  .hist-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 6px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .hist-row:last-child { border-bottom: none; }
  .hist-row .h-target small { color: #777; font-size: 12px; }
  .hist-row .h-time-wrap { display: flex; flex-direction: column; align-items: flex-end; }
  .hist-row .h-time { font-weight: 700; }
  .hist-row .h-vehicle { font-size: 11px; color: #4b2e83; font-weight: 700; }
  .hist-row.h-violation { background: #fbe4e4; }
  .hist-row .h-violation-count { color: #b4341a; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
<button id="topMenuBtn" class="top-menu-btn" aria-label="メニュー">☰</button>
<div id="topMenuPanel" class="top-menu-panel">
  <button id="topHistoryBtn">過去の記録</button>
  <button id="unsentBtn">未送信データの確認</button>
  <div class="admin-addr-box">
    アップロード先
    <code id="adminAddrText">未設定</code>
    <button id="editAdminBtn">編集</button>
  </div>
  <button id="updateBtn">最新版に更新する</button>
</div>
<h1>コースを選んでください</h1>
<p class="tagline">今日も一日安全運転・安全作業！</p>
<div class="grid">
  <a class="card" style="background:#4b2e83" href="murasaki/">紫コース</a>
  <a class="card" style="background:#2e7d32" href="midori/">緑コース</a>
  <a class="card" style="background:#b8860b" href="kiiro/">黄コース</a>
  <a class="card" style="background:#1565c0" href="ao/">青コース</a>
  <a class="card" style="background:#2b2b2b" href="kuro/">黒コース</a>
  <a class="card" style="background:#d6336c" href="pink/">ピンクコース</a>
  <a class="card" style="background:#7c4dbd" href="youpura_murasaki/">容プラ(紫)コース</a>
  <a class="card" style="background:#c99a1e" href="youpura_kiiro/">容プラ(黄)コース</a>
</div>
<div class="footer">
  <p class="version-tag" id="versionTag"></p>
</div>
<script>
const TOP_VERSION = "v2.6";
document.getElementById("versionTag").textContent = TOP_VERSION;

const ADMIN_PRESETS = [
  { label: "常務のPC", url: "https://192.168.11.34:8788" },
  { label: "みんなのPC", url: "https://192.168.11.16:8788" }
];

function getAdminServer(){
  try { return localStorage.getItem("gomi_admin_server") || ""; } catch (e) { return ""; }
}
function setAdminServer(v){
  try { localStorage.setItem("gomi_admin_server", v); } catch (e) {}
}
function renderAdminAddr(){
  const addr = getAdminServer();
  const preset = ADMIN_PRESETS.find(p => p.url === addr);
  document.getElementById("adminAddrText").textContent = preset ? preset.label : (addr || "未設定");
}
renderAdminAddr();

const ADMIN_PIN = "0325";

function askPin(onSuccess){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box";
  const p = document.createElement("p");
  p.textContent = "管理者用の暗証番号を入力してください";
  const input = document.createElement("input");
  input.type = "tel";
  input.inputMode = "numeric";
  input.placeholder = "暗証番号";
  const err = document.createElement("p");
  err.style.color = "#c0392b";
  err.style.fontSize = "12px";
  err.style.margin = "-8px 0 10px";
  err.style.display = "none";
  err.textContent = "暗証番号が違います。";
  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "modal-btn-cancel";
  cancelBtn.textContent = "キャンセル";
  cancelBtn.addEventListener("click", () => overlay.remove());
  const okBtn = document.createElement("button");
  okBtn.className = "modal-btn-ok";
  okBtn.textContent = "確認";
  okBtn.addEventListener("click", () => {
    if (input.value === ADMIN_PIN) {
      overlay.remove();
      onSuccess();
    } else {
      err.style.display = "block";
      input.value = "";
      input.focus();
    }
  });
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(input);
  box.appendChild(err);
  box.appendChild(actions);
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  input.focus();
}

function openAdminEditModal(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box";
  const p = document.createElement("p");
  p.textContent = "アップロード先を選んでください";
  const select = document.createElement("select");
  select.style.width = "100%";
  select.style.padding = "10px";
  select.style.fontSize = "16px";
  select.style.marginBottom = "8px";
  select.style.borderRadius = "8px";
  ADMIN_PRESETS.forEach(preset => {
    const opt = document.createElement("option");
    opt.value = preset.url;
    opt.textContent = preset.label;
    select.appendChild(opt);
  });
  const otherOpt = document.createElement("option");
  otherOpt.value = "__other__";
  otherOpt.textContent = "その他（手入力）";
  select.appendChild(otherOpt);

  const customInput = document.createElement("input");
  customInput.type = "text";
  customInput.placeholder = "例: https://192.168.1.50:8788";

  const currentAddr = getAdminServer();
  const matchedPreset = ADMIN_PRESETS.find(preset => preset.url === currentAddr);
  if (matchedPreset) {
    select.value = matchedPreset.url;
    customInput.style.display = "none";
    customInput.value = currentAddr;
  } else {
    select.value = "__other__";
    customInput.style.display = "block";
    customInput.value = currentAddr;
  }
  select.addEventListener("change", () => {
    customInput.style.display = select.value === "__other__" ? "block" : "none";
    if (select.value === "__other__") customInput.focus();
  });

  const actions = document.createElement("div");
  actions.className = "modal-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "modal-btn-cancel";
  cancelBtn.textContent = "キャンセル";
  cancelBtn.addEventListener("click", () => overlay.remove());
  const okBtn = document.createElement("button");
  okBtn.className = "modal-btn-ok";
  okBtn.textContent = "保存";
  okBtn.addEventListener("click", () => {
    const value = select.value === "__other__" ? customInput.value.trim() : select.value;
    setAdminServer(value);
    renderAdminAddr();
    overlay.remove();
  });
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(select);
  box.appendChild(customInput);
  box.appendChild(actions);
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

document.getElementById("editAdminBtn").addEventListener("click", () => {
  askPin(openAdminEditModal);
});

try {
  if (sessionStorage.getItem("gomi_just_updated") === "1") {
    sessionStorage.removeItem("gomi_just_updated");
    const msg = document.createElement("p");
    msg.textContent = "更新されました。";
    msg.style.color = "#2c8c3f";
    msg.style.fontWeight = "700";
    msg.style.fontSize = "13px";
    msg.style.margin = "0 0 10px";
    document.getElementById("versionTag").insertAdjacentElement("afterend", msg);
  }
} catch (e) {}

const ALL_COLORS = ["murasaki", "midori", "kiiro", "ao", "kuro", "pink"];
const ALL_SCHEDULES = ["getsumoku", "kakin", "pet1", "pet2"];

async function precacheAllCourses(){
  if (!navigator.onLine || !("serviceWorker" in navigator)) return;
  const jobs = [];
  ALL_COLORS.forEach((color) => {
    jobs.push(navigator.serviceWorker.register(color + "/sw.js", { scope: color + "/" }).catch(() => {}));
    ALL_SCHEDULES.forEach((schedule) => {
      jobs.push(
        navigator.serviceWorker
          .register(color + "/" + schedule + "/sw.js", { scope: color + "/" + schedule + "/" })
          .catch(() => {})
      );
    });
  });
  await Promise.all(jobs);
  try { localStorage.setItem("gomi_precache_date", new Date().toDateString()); } catch (e) {}
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    let last = null;
    try { last = localStorage.getItem("gomi_precache_date"); } catch (e) {}
    if (last !== new Date().toDateString()) {
      precacheAllCourses();
    }
  });
}

const HIST_CACHE_KEY = "gomi_history_cache";

function histArr(v){ return Array.isArray(v) ? v : (v ? [v] : []); }

function histRow(r){
  return {
    no: r["番号"],
    st: r["ST番号"],
    map: r["地図番号"],
    target: r["目標物"],
    time: r["収集時刻"] || "",
    violation: r["違反ゴミ個数"] || "",
    vehicle: r["車両番号"] || ""
  };
}

function histVehiclesOf(rows){
  const list = [...new Set(rows.map(r => r.vehicle).filter(v => v))];
  return list.join("・");
}

function histCourseRank(name){
  const s = histShortName(name);
  if (s.includes("月・木")) return 0;
  if (s.includes("火・金")) return 1;
  return s.includes("②") ? 3 : 2;
}

function histShortName(name){
  const m = String(name).match(/（(.+)）/);
  return m ? m[1] : String(name);
}

function histDateLabel(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const w = ["日","月","火","水","木","金","土"];
  return (d.getMonth() + 1) + "/" + d.getDate() + "（" + w[d.getDay()] + "）";
}

function formatHistSavedAt(iso){
  const d = new Date(iso);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function saveHistCache(days){
  try {
    localStorage.setItem(HIST_CACHE_KEY, JSON.stringify({
      savedAt: new Date().toISOString(),
      days: days.map(d => ({
        dateStr: d.dateStr,
        courses: d.courses.map(c => ({ color: c.color, name: c.name, rows: c.rows }))
      }))
    }));
  } catch (e) {}
}

function loadHistCache(){
  try { return JSON.parse(localStorage.getItem(HIST_CACHE_KEY) || "null"); } catch (e) { return null; }
}

async function fetchAllHistory(){
  const server = getAdminServer();
  if (server) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 6000);
    try {
      const base = (server.startsWith("http") ? server : "http://" + server).replace(/\/$/, "");
      const res = await fetch(base + "/api/history", { signal: controller.signal });
      const data = await res.json();
      if (res.ok && !data.error) {
        const days = histArr(data.days).map(day => ({
          dateStr: day.date,
          courses: histArr(day.courses).map(c => ({
            color: c.color,
            name: c.name,
            rows: histArr(c.rows).map(histRow)
          }))
        }));
        saveHistCache(days);
        return { days, fromServer: true, savedAt: null };
      }
    } catch (e) {
    } finally {
      clearTimeout(timeoutId);
    }
  }
  const cache = loadHistCache();
  if (cache && cache.days) return { days: cache.days, fromServer: false, savedAt: cache.savedAt };
  return null;
}

function buildHistGroups(days){
  const map = new Map();
  days.forEach(day => day.courses.forEach(c => {
    if (!c.rows.some(r => r.time || r.violation)) return;
    const key = c.color + "|" + c.name;
    if (!map.has(key)) map.set(key, { color: c.color, name: c.name, days: [] });
    map.get(key).days.push({ dateStr: day.dateStr, rows: c.rows });
  }));
  const groups = [...map.values()];
  groups.forEach(g => g.days.sort((a, b) => (a.dateStr < b.dateStr ? 1 : -1)));
  groups.sort((a, b) => {
    if (a.color !== b.color) return a.color.localeCompare(b.color, "ja");
    return histCourseRank(a.name) - histCourseRank(b.name);
  });
  return groups;
}

function histTitle(text){
  const p = document.createElement("p");
  p.className = "hist-title";
  p.textContent = text;
  return p;
}

function histNote(text){
  const p = document.createElement("p");
  p.className = "hist-note";
  p.textContent = text;
  return p;
}

function histActions(overlay, onBack){
  const actions = document.createElement("div");
  actions.className = "modal-actions";
  if (onBack) {
    const backBtn = document.createElement("button");
    backBtn.className = "modal-btn-cancel";
    backBtn.textContent = "戻る";
    backBtn.addEventListener("click", onBack);
    actions.appendChild(backBtn);
  }
  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-btn-ok";
  closeBtn.textContent = "閉じる";
  closeBtn.addEventListener("click", () => overlay.remove());
  actions.appendChild(closeBtn);
  return actions;
}

function histListItem(nameText, subText, onClick){
  const li = document.createElement("li");
  li.className = "hist-item";
  const name = document.createElement("span");
  name.className = "hist-item-name";
  name.textContent = nameText;
  const sub = document.createElement("span");
  sub.className = "hist-item-sub";
  sub.textContent = subText;
  li.appendChild(name);
  li.appendChild(sub);
  li.addEventListener("click", onClick);
  return li;
}

function renderHistColorList(overlay, box, result){
  box.innerHTML = "";
  box.appendChild(histTitle("過去の記録（直近14日）"));
  box.appendChild(histNote(result.fromServer
    ? "管理PCに保存された全コースの記録です。"
    : "管理PCに接続できないため、最後に取得した記録（" + formatHistSavedAt(result.savedAt) + "時点）です。"));
  const groups = buildHistGroups(result.days);
  if (groups.length === 0) {
    box.appendChild(histNote("過去14日分の記録はありません。"));
  } else {
    const byColor = new Map();
    groups.forEach(g => {
      if (!byColor.has(g.color)) byColor.set(g.color, []);
      byColor.get(g.color).push(g);
    });
    const ul = document.createElement("ul");
    ul.className = "hist-list";
    byColor.forEach((gs, color) => {
      const dayCount = new Set(gs.flatMap(g => g.days.map(d => d.dateStr))).size;
      ul.appendChild(histListItem(color, dayCount + "日分 ›", () => renderHistColorDays(overlay, box, result, color, gs)));
    });
    box.appendChild(ul);
  }
  box.appendChild(histActions(overlay, null));
}

function renderHistColorDays(overlay, box, result, color, groups){
  box.innerHTML = "";
  box.appendChild(histTitle(color));
  box.appendChild(histNote("日付をタップすると、その日の記録を見られます。"));
  const byDate = new Map();
  groups.forEach(g => g.days.forEach(day => {
    if (!byDate.has(day.dateStr)) byDate.set(day.dateStr, []);
    byDate.get(day.dateStr).push({ group: g, day });
  }));
  const dates = [...byDate.keys()].sort((a, b) => (a < b ? 1 : -1));
  const ul = document.createElement("ul");
  ul.className = "hist-list";
  dates.forEach(dateStr => {
    const items = byDate.get(dateStr);
    const vehicles = histVehiclesOf(items.flatMap(it => it.day.rows));
    const sub = (vehicles ? "車両 " + vehicles + "　" : "") + items.length + "コース ›";
    ul.appendChild(histListItem(histDateLabel(dateStr), sub, () => {
      if (items.length === 1) {
        renderHistDayDetail(overlay, box, result, items[0].group, items[0].day,
          () => renderHistColorDays(overlay, box, result, color, groups));
      } else {
        renderHistDateCourses(overlay, box, result, color, groups, dateStr, items);
      }
    }));
  });
  box.appendChild(ul);
  box.appendChild(histActions(overlay, () => renderHistColorList(overlay, box, result)));
}

function renderHistDateCourses(overlay, box, result, color, groups, dateStr, items){
  box.innerHTML = "";
  box.appendChild(histTitle(histDateLabel(dateStr) + "　" + color));
  const ul = document.createElement("ul");
  ul.className = "hist-list";
  items.forEach(({ group, day }) => {
    const done = day.rows.filter(r => r.time).length;
    const vehicles = histVehiclesOf(day.rows);
    ul.appendChild(histListItem(
      histShortName(group.name),
      (vehicles ? "車両 " + vehicles + "　" : "") + done + " / " + day.rows.length + " 件完了 ›",
      () => renderHistDayDetail(overlay, box, result, group, day,
        () => renderHistDateCourses(overlay, box, result, color, groups, dateStr, items))
    ));
  });
  box.appendChild(ul);
  box.appendChild(histActions(overlay, () => renderHistColorDays(overlay, box, result, color, groups)));
}

function renderHistDayDetail(overlay, box, result, group, day, onBack){
  box.innerHTML = "";
  box.appendChild(histTitle(histDateLabel(day.dateStr) + "　" + group.color + " " + histShortName(group.name)));
  let onlyViolation = false;
  const filterBtn = document.createElement("button");
  filterBtn.className = "hist-filter-btn";
  const ul = document.createElement("ul");
  ul.className = "hist-detail";

  function renderRows(){
    filterBtn.textContent = onlyViolation ? "すべて表示に戻す" : "違反ステーションだけ表示";
    filterBtn.classList.toggle("on", onlyViolation);
    ul.innerHTML = "";
    const rows = day.rows.filter(r => !onlyViolation || r.violation);
    if (rows.length === 0) {
      const empty = document.createElement("li");
      empty.className = "hist-row";
      empty.textContent = "違反ステーションはありません。";
      ul.appendChild(empty);
    }
    rows.forEach(r => {
      const li = document.createElement("li");
      li.className = "hist-row" + (r.violation ? " h-violation" : "");
      const target = document.createElement("span");
      target.className = "h-target";
      target.textContent = r.target || "";
      target.appendChild(document.createElement("br"));
      const small = document.createElement("small");
      small.textContent = (r.map || "") + " / ST" + (r.st || "");
      target.appendChild(small);
      const timeWrap = document.createElement("span");
      timeWrap.className = "h-time-wrap";
      if (r.vehicle) {
        const veh = document.createElement("span");
        veh.className = "h-vehicle";
        veh.textContent = "車両 " + r.vehicle;
        timeWrap.appendChild(veh);
      }
      const time = document.createElement("span");
      time.className = "h-time";
      time.textContent = r.time || "--:--";
      timeWrap.appendChild(time);
      li.appendChild(target);
      li.appendChild(timeWrap);
      if (r.violation) {
        const v = document.createElement("span");
        v.className = "h-violation-count";
        v.textContent = "違反" + r.violation + "個";
        li.appendChild(v);
      }
      ul.appendChild(li);
    });
  }

  filterBtn.addEventListener("click", () => {
    onlyViolation = !onlyViolation;
    renderRows();
  });
  box.appendChild(filterBtn);
  box.appendChild(ul);
  renderRows();
  box.appendChild(histActions(overlay, onBack));
}
function dateKeyOf(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function collectUnsentDays(){
  let names = {};
  try { names = JSON.parse(localStorage.getItem("gomi_course_names") || "{}"); } catch (e) {}
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 14);
  const todayKey = dateKeyOf(new Date());
  const cutoffKey = dateKeyOf(cutoff);
  const items = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    const m = key.match(/^gomi_(.+)_(\d{4}-\d{2}-\d{2})$/);
    if (!m) continue;
    const courseId = m[1];
    const date = m[2];
    if (/^(saved|v|cb|ct|cv|veh)_/.test(courseId)) continue;
    if (date >= todayKey || date < cutoffKey) continue;
    if (localStorage.getItem("gomi_saved_" + courseId + "_" + date) === "1") continue;
    let recs = {};
    try { recs = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) {}
    if (Object.keys(recs).length === 0) continue;
    items.push({ courseId, date, name: names[courseId] || courseId });
  }
  items.sort((a, b) => (a.date < b.date ? 1 : -1));
  return items;
}

function courseHrefOf(courseId){
  const idx = courseId.indexOf("-");
  return courseId.slice(0, idx) + "/" + courseId.slice(idx + 1) + "/";
}

function openUnsentList(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box hist-box";
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);

  box.appendChild(histTitle("未送信データ（直近14日）"));
  const items = collectUnsentDays();
  if (items.length === 0) {
    box.appendChild(histNote("未送信のデータはありません。"));
  } else {
    box.appendChild(histNote("タップするとそのコースの画面が開きます。画面上の「送信する」で管理PCに送れます。"));
    const ul = document.createElement("ul");
    ul.className = "hist-list";
    items.forEach(item => {
      ul.appendChild(histListItem(
        item.name,
        histDateLabel(item.date) + " ›",
        () => { location.href = courseHrefOf(item.courseId); }
      ));
    });
    box.appendChild(ul);
  }
  box.appendChild(histActions(overlay, null));
}

async function openTopHistory(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal-box hist-box";
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  box.appendChild(histNote("読み込み中..."));

  const result = await fetchAllHistory();
  if (result === null) {
    box.innerHTML = "";
    box.appendChild(histTitle("過去の記録"));
    box.appendChild(histNote("管理PCに接続できず、取得済みの記録もありません。アップロード先を設定して、事務所のWi-Fiでもう一度開いてください。"));
    box.appendChild(histActions(overlay, null));
    return;
  }
  renderHistColorList(overlay, box, result);
}

const topMenuBtn = document.getElementById("topMenuBtn");
const topMenuPanel = document.getElementById("topMenuPanel");
topMenuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  topMenuPanel.classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!topMenuPanel.contains(e.target) && e.target !== topMenuBtn) topMenuPanel.classList.remove("open");
});
document.getElementById("topHistoryBtn").addEventListener("click", () => {
  topMenuPanel.classList.remove("open");
  openTopHistory();
});
document.getElementById("unsentBtn").addEventListener("click", () => {
  topMenuPanel.classList.remove("open");
  openUnsentList();
});
topMenuPanel.addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON" && e.target.id !== "editAdminBtn") topMenuPanel.classList.remove("open");
});

document.getElementById("updateBtn").addEventListener("click", async () => {
  const btn = document.getElementById("updateBtn");
  const originalText = btn.textContent;
  if (!navigator.onLine) {
    btn.textContent = "オンラインの時に押してください";
    setTimeout(() => { btn.textContent = originalText; }, 3000);
    return;
  }
  btn.textContent = "更新中...";
  btn.disabled = true;
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  try { localStorage.removeItem("gomi_precache_date"); } catch (e) {}
  try { sessionStorage.setItem("gomi_just_updated", "1"); } catch (e) {}
  location.reload();
});
