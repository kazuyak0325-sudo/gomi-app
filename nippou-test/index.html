<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>収集日報</title>
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e4e7ec;
    --text: #1c2128;
    --text-muted: #6b7280;
    --ok: #2c8c3f;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    padding: 14px 18px;
  }
  header h1 { margin: 0; font-size: 19px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; }
  .back-link {
    display: inline-block;
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    background: rgba(255,255,255,0.18);
    padding: 5px 10px;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 15px; color: var(--accent-dark); }
  label { display: block; font-size: 13px; color: var(--text-muted); margin: 10px 0 4px; }
  select, input[type=text], input[type=number], input[type=date] {
    width: 100%;
    padding: 10px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .row5 label { text-align: center; margin: 0 0 4px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .row4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
  .weight-total-row {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    text-align: right;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-dark);
  }
  .region-btn.on { background: var(--accent); color: #fff; border-color: var(--accent) !important; }
  .auto-field {
    background: #f1f5f4;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    color: var(--text-muted);
  }
  .time-wrap { padding: 0; }
  .time-wrap input[type=time] {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    text-align: left;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  .card-head h2 { margin: 0; }
  .staff-menu-btn {
    background: #f1f5f4;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 32px;
    font-size: 17px;
    line-height: 1;
    color: var(--text-muted);
    cursor: pointer;
  }
  .staff-menu-btn:active { background: #e4e7ec; }
  .staff-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .staff-modal-overlay.open { display: flex; }
  .staff-modal-box {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  .staff-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .staff-modal-header h3 { margin: 0; font-size: 16px; color: var(--accent-dark); }
  .staff-modal-close {
    background: none;
    border: none;
    font-size: 24px;
    line-height: 1;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 4px;
  }
  .staff-list-area {
    overflow-y: auto;
    flex: 1;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    min-height: 80px;
  }
  .staff-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 2px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .staff-row:last-child { border-bottom: none; }
  .staff-row-name { flex: 1; }
  .staff-row button, .staff-add-area .btn-primary {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #f7f7f7;
    color: var(--text);
    cursor: pointer;
  }
  .staff-row .staff-del-btn { color: var(--danger); border-color: #e8c7c1; }
  .staff-edit-row { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .staff-edit-row input {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .staff-add-area label { margin: 6px 0 4px; }
  .staff-add-area input { margin-bottom: 4px; }
  .staff-add-area .btn-primary {
    width: 100%;
    font-size: 14px;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    margin-top: 4px;
  }
  .auto-field strong { color: var(--text); }
  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
  .link-btn {
    display: block;
    background: none;
    border: none;
    color: var(--accent-dark);
    font-size: 13px;
    text-decoration: underline;
    padding: 6px 0 2px;
    cursor: pointer;
    text-align: left;
  }
  .status-msg { margin-top: 10px; font-size: 14px; text-align: center; }
  .status-msg.ok { color: var(--ok); }
  .status-msg.err { color: var(--danger); }
  .field-error { border-color: var(--danger) !important; border-width: 2px !important; }
  details.server-setting { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  details.server-setting select, details.server-setting input { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <a class="back-link" href="../">← トップに戻る</a>
  <h1>収集日報の入力</h1>
  <p>市への報告書用データを入力して送信します（既存のタップ記録アプリとは別ページです）</p>
</header>
<main>
  <div class="card">
    <h2>地区</h2>
    <div class="region-toggle" id="nippouRegionToggle" style="display:flex;gap:8px;">
      <button type="button" class="link-btn region-btn" data-region="otawara" style="flex:1;text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:9px;text-align:center;">大田原地区</button>
      <button type="button" class="link-btn region-btn" data-region="kurobane" style="flex:1;text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:9px;text-align:center;">黒羽・湯津上地区</button>
    </div>
  </div>

  <div class="card">
    <h2>車両NO・収集地区</h2>
    <div class="auto-field" id="dateField">読み込み中...</div>

    <label>車両NO（自動で入ります。違う場合は書き換えてください）</label>
    <input type="text" inputmode="numeric" id="vehicleInput" placeholder="例：0317">

    <button type="button" class="link-btn" id="toggleVehicle2Btn">＋ 車両故障などで途中から別の車両に交代した場合はこちら</button>
    <div id="vehicle2Wrap" style="display:none;">
      <label>交代後の車両NO</label>
      <input type="text" inputmode="numeric" id="vehicle2Input" placeholder="例：0450">
    </div>

    <div id="otawaraDistrictWrap">
      <label>収集地区</label>
      <input type="text" id="district" list="districtListOtawara" placeholder="例：新富　城山" autocomplete="off">
      <datalist id="districtListOtawara"></datalist>
    </div>
    <div id="kurobaneDistrictWrap" style="display:none;">
      <label>収集地区（不燃・容プラ）</label>
      <input type="text" id="districtFunen" list="districtListFunen" placeholder="例：品川　片府田" autocomplete="off">
      <datalist id="districtListFunen"></datalist>
      <label>収集地区（可燃）</label>
      <input type="text" id="districtKaen" list="districtListKaen" placeholder="例：大豆田　両郷" autocomplete="off">
      <datalist id="districtListKaen"></datalist>
    </div>

    <label>収集時間 開始</label>
    <div class="auto-field">8:30（固定）</div>

    <label>帰社時間 終了</label>
    <div class="auto-field time-wrap">
      <input type="time" id="timeEndInput">
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>搭乗者</h2>
      <button type="button" class="staff-menu-btn" id="staffMenuBtn" aria-label="搭乗者リストを編集">☰</button>
    </div>
    <label>運転手</label>
    <select id="driverSelect"></select>

    <label>助手</label>
    <select id="helperSelect"></select>
  </div>

  <div id="otawaraWeightCards">
    <div class="card">
      <h2>可燃収集量（kg）</h2>
      <div class="row5">
        <div><label>1回目</label><input type="number" inputmode="decimal" id="b1"></div>
        <div><label>2回目</label><input type="number" inputmode="decimal" id="b2"></div>
        <div><label>3回目</label><input type="number" inputmode="decimal" id="b3"></div>
        <div><label>4回目</label><input type="number" inputmode="decimal" id="b4"></div>
        <div><label>5回目</label><input type="number" inputmode="decimal" id="b5"></div>
      </div>
      <div class="weight-total-row">合計：<span id="burnableTotal">0</span> kg</div>
    </div>

    <div class="card">
      <h2>資源ごみ収集量（kg）</h2>
      <div class="row4">
        <div><label>ペット</label><input type="number" inputmode="decimal" id="petBottle"></div>
        <div><label>ダンボール</label><input type="number" inputmode="decimal" id="cardboardKg"></div>
        <div><label>紙パック</label><input type="number" inputmode="decimal" id="kamipack"></div>
        <div><label>容プラ</label><input type="number" inputmode="decimal" id="youpura"></div>
      </div>
      <div class="weight-total-row">合計：<span id="resourceTotal">0</span> kg</div>
    </div>
  </div>

  <div id="kurobaneWeightCards" style="display:none;">
    <div class="card">
      <h2>可燃収集量（kg）</h2>
      <div class="row5">
        <div><label>1回目</label><input type="number" inputmode="decimal" id="k_b1"></div>
        <div><label>2回目</label><input type="number" inputmode="decimal" id="k_b2"></div>
        <div><label>3回目</label><input type="number" inputmode="decimal" id="k_b3"></div>
        <div><label>4回目</label><input type="number" inputmode="decimal" id="k_b4"></div>
        <div><label>5回目</label><input type="number" inputmode="decimal" id="k_b5"></div>
      </div>
      <div class="weight-total-row">合計：<span id="kurobaneBurnableTotal">0</span> kg</div>
    </div>

    <div class="card">
      <h2>不燃収集量（kg）</h2>
      <div class="row4">
        <div><label>ビン</label><input type="number" inputmode="decimal" id="k_bin"></div>
        <div><label>カン</label><input type="number" inputmode="decimal" id="k_can"></div>
        <div><label>不燃</label><input type="number" inputmode="decimal" id="k_funen"></div>
        <div><label>ペット</label><input type="number" inputmode="decimal" id="k_pet"></div>
      </div>
      <div class="weight-total-row">合計：<span id="kurobaneFunenTotal">0</span> kg</div>
    </div>

    <div class="card">
      <h2>資源ごみ収集量（kg）</h2>
      <div class="row4">
        <div><label>雑誌</label><input type="number" inputmode="decimal" id="k_zasshi"></div>
        <div><label>新聞</label><input type="number" inputmode="decimal" id="k_shinbun"></div>
        <div><label>ダンボール</label><input type="number" inputmode="decimal" id="k_danball"></div>
        <div><label>紙パック</label><input type="number" inputmode="decimal" id="k_kamipack"></div>
      </div>
      <div class="weight-total-row">合計：<span id="kurobaneResourceTotal">0</span> kg</div>
    </div>

    <div class="card">
      <h2>容プラ収集量（kg）</h2>
      <div class="row4">
        <div><label>容プラ</label><input type="number" inputmode="decimal" id="k_youpura"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>走行距離</h2>
    <div class="row2">
      <div><label>走行距離 開始（km）</label><input type="text" inputmode="decimal" id="odoStart" placeholder="例：1000"></div>
      <div><label>走行距離 終了（km）</label><input type="text" inputmode="decimal" id="odoEnd" placeholder="例：1100"></div>
    </div>
    <label>走行距離（自動計算）</label>
    <div class="auto-field" id="odoDistanceField">-</div>
  </div>

  <div class="card">
    <button class="btn-primary" id="submitBtn">本日の業務内容を送信</button>
    <div class="status-msg" id="statusMsg"></div>
    <details class="server-setting">
      <summary>送信先設定</summary>
      <select id="serverPresetSelect"></select>
      <input type="text" id="serverAddrInput" placeholder="例：https://192.168.11.34:8788">
    </details>
  </div>
</main>

<div class="staff-modal-overlay" id="staffModalOverlay">
  <div class="staff-modal-box">
    <div class="staff-modal-header">
      <h3>搭乗者リストの編集</h3>
      <button type="button" class="staff-modal-close" id="staffModalCloseBtn">×</button>
    </div>
    <div class="staff-list-area" id="staffListArea">読み込み中...</div>
    <div class="staff-add-area">
      <label>新しく追加する氏名（姓 名）</label>
      <input type="text" id="newStaffName" placeholder="例：山田 太郎">
      <label>ふりがな（ひらがな、並び順に使います）</label>
      <input type="text" id="newStaffReading" placeholder="例：やまだたろう">
      <button type="button" class="btn-primary" id="addStaffBtn">追加する</button>
      <div class="status-msg" id="staffModalMsg"></div>
    </div>
  </div>
</div>

function pad2(n){ return String(n).padStart(2, "0"); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

function stripCommas(s){
  return (s || "").replace(/,/g, "");
}
function formatWithCommas(numStr){
  if (!numStr) return "";
  const parts = String(numStr).split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return parts.join(".");
}
function updateOdoDistance(){
  const field = document.getElementById("odoDistanceField");
  const start = parseFloat(stripCommas(document.getElementById("odoStart").value));
  const end = parseFloat(stripCommas(document.getElementById("odoEnd").value));
  if (!isNaN(start) && !isNaN(end) && end >= start) {
    field.textContent = formatWithCommas(String(Math.round((end - start) * 1000) / 1000)) + " km";
  } else {
    field.textContent = "-";
  }
}
function handleOdoInput(e){
  const input = e.target;
  const cursorFromEnd = input.value.length - input.selectionStart;
  const raw = stripCommas(input.value).replace(/[^\d.]/g, "");
  const formatted = formatWithCommas(raw);
  input.value = formatted;
  const newPos = Math.max(0, formatted.length - cursorFromEnd);
  input.setSelectionRange(newPos, newPos);
  updateOdoDistance();
}

async function fetchStaffList(){
  const server = getAdminServer();
  if (!server) return null;
  try {
    const res = await fetch(server.replace(/\/$/, "") + "/api/staff-list", { cache: "no-store" });
    const data = await res.json();
    if (data.ok && Array.isArray(data.staff)) return data.staff;
  } catch (e) {}
  return null;
}

async function refreshStaffList(){
  const list = await fetchStaffList();
  if (list) {
    STAFF_LIST = list;
    buildStaffSelects();
  }
}

async function callStaffApi(path, body){
  const server = getAdminServer();
  const msg = document.getElementById("staffModalMsg");
  if (!server) {
    msg.className = "status-msg err";
    msg.textContent = "送信先設定（事務所PCのアドレス）を先に設定してください。";
    return null;
  }
  try {
    const res = await fetch(server.replace(/\/$/, "") + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.error) {
      msg.className = "status-msg err";
      msg.textContent = data.error;
      return null;
    }
    return data;
  } catch (e) {
    msg.className = "status-msg err";
    msg.textContent = "事務所PCに接続できませんでした。送信先設定とWi-Fi接続を確認してください。";
    return null;
  }
}

    msg.className = "status-msg ok";
    msg.textContent = "更新しました。";

      input.value = select.value;
      setAdminServer(select.value);
    }
  });
  input.addEventListener("change", () => setAdminServer(input.value.trim()));
}

async function submitReport(server){
  const statusMsg = document.getElementById("statusMsg");
  const course = CURRENT_COURSE;
  const date = CURRENT_DATE;
  const vehicleNo = document.getElementById("vehicleInput").value.trim();
  const vehicleNo2 = document.getElementById("vehicle2Input").value.trim();

  if (!vehicleNo) {
    statusMsg.className = "status-msg err";
    statusMsg.textContent = "車両NOを入力してください。";
    return;
  }
  if (!server) {
    statusMsg.className = "status-msg err";
    statusMsg.textContent = "送信先設定（事務所PCのアドレス）を入力してください。";
    return;
  }

  const burnable = [
    document.getElementById("b1").value,
    document.getElementById("b2").value,
    document.getElementById("b3").value,
    document.getElementById("b4").value,
    document.getElementById("b5").value
  ];
  const count = burnable.filter(v => v !== "" && v !== null).length;

  const region = getNippouRegion();
  const payload = {
    date: date,
    courseId: course ? course.id : "",
    courseName: course ? course.name : "",
    color: course ? course.color : "",
    region: region,
    vehicleNo: vehicleNo,
    vehicleNo2: vehicleNo2,
    driver: document.getElementById("driverSelect").value,
    helper: document.getElementById("helperSelect").value,
    burnable: burnable,
    petBottle: document.getElementById("petBottle").value,
    cardboardKg: document.getElementById("cardboardKg").value,
    kamipack: document.getElementById("kamipack").value,
    youpura: document.getElementById("youpura").value,
    kurobaneBurnable: [
      document.getElementById("k_b1").value,
      document.getElementById("k_b2").value,
      document.getElementById("k_b3").value,
      document.getElementById("k_b4").value,
      document.getElementById("k_b5").value
    ],
    kurobaneBin: document.getElementById("k_bin").value,
    kurobaneCan: document.getElementById("k_can").value,
    kurobaneFunen: document.getElementById("k_funen").value,
    kurobanePet: document.getElementById("k_pet").value,
    kurobaneZasshi: document.getElementById("k_zasshi").value,
    kurobaneShinbun: document.getElementById("k_shinbun").value,
    kurobaneDanball: document.getElementById("k_danball").value,
    kurobaneKamipack: document.getElementById("k_kamipack").value,
    kurobaneYoupura: document.getElementById("k_youpura").value,
    district: currentDistrictValue(),
    odoStart: stripCommas(document.getElementById("odoStart").value),
    odoEnd: stripCommas(document.getElementById("odoEnd").value),
    timeStart: "8:30",
    timeEnd: document.getElementById("timeEndInput").value,
    count: count
  };

  statusMsg.className = "status-msg";
  statusMsg.textContent = "送信中...";
  const serverList = (Array.isArray(server) ? server : [server]).filter(Boolean);
  const results = await Promise.all(serverList.map(async (s) => {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);
      const res = await fetch(s.replace(/\/$/, "") + "/api/nippou-submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      const data = await res.json();
      return !!data.ok;
    } catch (e) {
      return false;
    }
  }));
  const successCount = results.filter(Boolean).length;
  if (successCount === 0) {
    statusMsg.className = "status-msg err";
    statusMsg.textContent = "送信に失敗しました。事務所PCに接続できませんでした。";
    return;
  }
  statusMsg.className = "status-msg ok";
  if (successCount === serverList.length) {
    statusMsg.textContent = "送信しました！";
  } else {
    statusMsg.textContent = "送信しました（" + (serverList.length - successCount) + "台には接続できませんでした）";
  }
  clearDraft();

  if (course) {
    const path = courseUrlPath(course.id);
    if (path) {
      try { sessionStorage.setItem("gomi_autosend_servers", JSON.stringify(serverList)); } catch (e) {}
      statusMsg.textContent += "　このコースの収集データも続けて送信します…";
      setTimeout(() => { location.href = path + "?autosend=1"; }, 900);
    }
  }
}

function courseUrlPath(courseId){
  const idx = courseId.indexOf("-");
  if (idx === -1) return null;
  const colorPart = courseId.substring(0, idx);
  const subPart = courseId.substring(idx + 1);
  return "../" + colorPart + "/" + subPart + "/";
}

const CURRENT_DATE = todayStr();
const WEEKDAYS = ["日","月","火","水","木","金","土"];
const LAST_COURSE_KEY = "gomi_last_nippou_course";
const presetCourseId = new URLSearchParams(location.search).get("course");
let CURRENT_COURSE = presetCourseId ? findCourse(presetCourseId) : null;
if (CURRENT_COURSE) {
  try { localStorage.setItem(LAST_COURSE_KEY, CURRENT_COURSE.id); } catch (e) {}
} else {
  try {
    const lastCourseId = localStorage.getItem(LAST_COURSE_KEY);
    if (lastCourseId) CURRENT_COURSE = findCourse(lastCourseId);
  } catch (e) {}
}
// URL/保存済みのコースが分かっている場合は、そのコースの地域(大田原/黒羽)に
// リージョン設定も合わせる。ここで合わせておかないと、あとでbuildCourseSelect()が
// 「選ばれているコースが現在のリージョンと合わない」と判断して、せっかく
// 指定されたコースを無関係な地域の先頭コースに上書きしてしまう。
if (CURRENT_COURSE) {
  setNippouRegion(("" + CURRENT_COURSE.id).startsWith("kurobane_") ? "kurobane" : "otawara");
}

const dateField = document.getElementById("dateField");
const weekday = WEEKDAYS[new Date(CURRENT_DATE + "T00:00:00").getDay()];
dateField.innerHTML = "<strong>" + CURRENT_DATE.replace(/-/g, "/") + "（" + weekday + "）</strong>";

document.getElementById("toggleVehicle2Btn").addEventListener("click", () => {
  const wrap = document.getElementById("vehicle2Wrap");
  const btn = document.getElementById("toggleVehicle2Btn");
  const showing = wrap.style.display !== "none";
  wrap.style.display = showing ? "none" : "block";
  btn.textContent = showing
    ? "＋ 車両故障などで途中から別の車両に交代した場合はこちら"
    : "－ 交代車両の入力を閉じる";
});

const WEIGHT_TOTAL_GROUPS = [
  { fieldIds: ["b1", "b2", "b3", "b4", "b5"], totalId: "burnableTotal" },
  { fieldIds: ["petBottle", "cardboardKg", "kamipack", "youpura"], totalId: "resourceTotal" },
  { fieldIds: ["k_b1", "k_b2", "k_b3", "k_b4", "k_b5"], totalId: "kurobaneBurnableTotal" },
  { fieldIds: ["k_bin", "k_can", "k_funen", "k_pet"], totalId: "kurobaneFunenTotal" },
  { fieldIds: ["k_zasshi", "k_shinbun", "k_danball", "k_kamipack"], totalId: "kurobaneResourceTotal" }
];

function sumFieldIds(ids){
  return ids.reduce((sum, id) => {
    const v = parseFloat(document.getElementById(id).value);
    return sum + (isNaN(v) ? 0 : v);
  }, 0);
}
function updateWeightTotals(){
  WEIGHT_TOTAL_GROUPS.forEach(group => {
    const el = document.getElementById(group.totalId);
    if (el) el.textContent = sumFieldIds(group.fieldIds).toLocaleString("ja-JP");
  });
}
WEIGHT_TOTAL_GROUPS.forEach(group => {
  group.fieldIds.forEach(id => {
    document.getElementById(id).addEventListener("input", updateWeightTotals);
  });
});
updateWeightTotals();

const REQUIRED_FIELD_IDS = ["vehicleInput", "driverSelect", "helperSelect", "timeEndInput", "odoStart", "odoEnd"];
const DISTRICT_FIELD_IDS = ["district", "districtFunen", "districtKaen"];
const OTAWARA_WEIGHT_FIELD_IDS = ["b1", "b2", "b3", "b4", "b5", "petBottle", "cardboardKg", "kamipack", "youpura"];
const KUROBANE_WEIGHT_FIELD_IDS = ["k_b1", "k_b2", "k_b3", "k_b4", "k_b5", "k_bin", "k_can", "k_funen", "k_pet", "k_zasshi", "k_shinbun", "k_danball", "k_kamipack", "k_youpura"];
const ALL_WEIGHT_FIELD_IDS = OTAWARA_WEIGHT_FIELD_IDS.concat(KUROBANE_WEIGHT_FIELD_IDS);

function getNippouRegion(){
  try { return localStorage.getItem("gomi_nippou_region") || "otawara"; } catch (e) { return "otawara"; }
}
function setNippouRegion(v){
  try { localStorage.setItem("gomi_nippou_region", v); } catch (e) {}
}
function currentWeightFieldIds(){
  return getNippouRegion() === "kurobane" ? KUROBANE_WEIGHT_FIELD_IDS : OTAWARA_WEIGHT_FIELD_IDS;
}
function courseRegion(course){
  return ("" + course.id).startsWith("kurobane_") ? "kurobane" : "otawara";
}
function isKaenCourse(){
  return ("" + (CURRENT_COURSE ? CURRENT_COURSE.id : "")).startsWith("kurobane_kaen");
}
function currentDistrictFieldId(){
  if (getNippouRegion() !== "kurobane") return "district";
  return isKaenCourse() ? "districtKaen" : "districtFunen";
}
function currentDistrictValue(){
  if (getNippouRegion() !== "kurobane") return document.getElementById("district").value;
  const kaenVal = document.getElementById("districtKaen").value.trim();
  const funenVal = document.getElementById("districtFunen").value.trim();
  return isKaenCourse() ? (kaenVal || funenVal) : (funenVal || kaenVal);
}
function applyNippouRegion(){
  const region = getNippouRegion();
  document.getElementById("otawaraWeightCards").style.display = region === "otawara" ? "" : "none";
  document.getElementById("kurobaneWeightCards").style.display = region === "kurobane" ? "" : "none";
  document.getElementById("otawaraDistrictWrap").style.display = region === "otawara" ? "" : "none";
  document.getElementById("kurobaneDistrictWrap").style.display = region === "kurobane" ? "" : "none";
  document.querySelectorAll(".region-btn").forEach((btn) => {
    btn.classList.toggle("on", btn.dataset.region === region);
  });
}
buildDistrictLists();
applyNippouRegion();
const KUROBANE_REGION_PIN = "0706";
document.querySelectorAll(".region-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    if (btn.dataset.region === "kurobane" && getNippouRegion() !== "kurobane") {
      const pin = prompt("黒羽・湯津上地区は準備中です。暗証番号を入力してください。");
      if (pin === null) return;
      if (pin !== KUROBANE_REGION_PIN) { alert("暗証番号が違います。"); return; }
    }
    setNippouRegion(btn.dataset.region);
    applyNippouRegion();
  });
});

function clearFieldErrors(){
  REQUIRED_FIELD_IDS.concat(ALL_WEIGHT_FIELD_IDS).concat(DISTRICT_FIELD_IDS).forEach(id => {
    document.getElementById(id).classList.remove("field-error");
  });
}

function validateNippouForm(){
  const invalidIds = [];
  REQUIRED_FIELD_IDS.forEach(id => {
    if (!document.getElementById(id).value.trim()) invalidIds.push(id);
  });
  if (!currentDistrictValue().trim()) invalidIds.push(currentDistrictFieldId());
  const weightIds = currentWeightFieldIds();
  const hasWeight = weightIds.some(id => document.getElementById(id).value.trim() !== "");
  if (!hasWeight) invalidIds.push(...weightIds);
  return invalidIds;
}

REQUIRED_FIELD_IDS.concat(ALL_WEIGHT_FIELD_IDS).concat(DISTRICT_FIELD_IDS).forEach(id => {
  document.getElementById(id).addEventListener("input", (e) => e.target.classList.remove("field-error"));
  document.getElementById(id).addEventListener("change", (e) => e.target.classList.remove("field-error"));
});

document.getElementById("submitBtn").addEventListener("click", () => {
  const statusMsg = document.getElementById("statusMsg");
  clearFieldErrors();
  const invalidIds = validateNippouForm();
  if (invalidIds.length > 0) {
    invalidIds.forEach(id => document.getElementById(id).classList.add("field-error"));
    statusMsg.className = "status-msg err";
    statusMsg.textContent = "赤枠の項目を入力してください。";
    document.getElementById(invalidIds[0]).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  submitReport(ADMIN_PRESETS.map(p => p.url));
});
updateAutoField();
restoreDraft();
updateOdoDistance();
document.getElementById("odoStart").addEventListener("input", handleOdoInput);
document.getElementById("odoEnd").addEventListener("input", handleOdoInput);
document.querySelector("main").addEventListener("input", saveDraft);
document.querySelector("main").addEventListener("change", saveDraft);
</script>
</body>
</html>
