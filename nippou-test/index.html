<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>収集日報（テスト）</title>
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e4e7ec;
    --text: #1c2128;
    --text-muted: #6b7280;
    --ok: #2c8c3f;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    padding: 14px 18px;
  }
  header h1 { margin: 0; font-size: 19px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; }
  .back-link {
    display: inline-block;
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    background: rgba(255,255,255,0.18);
    padding: 5px 10px;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 15px; color: var(--accent-dark); }
  label { display: block; font-size: 13px; color: var(--text-muted); margin: 10px 0 4px; }
  select, input[type=text], input[type=number], input[type=date] {
    width: 100%;
    padding: 10px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .row5 label { text-align: center; margin: 0 0 4px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .auto-field {
    background: #f1f5f4;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    color: var(--text-muted);
  }
  .time-wrap { padding: 0; }
  .time-wrap input[type=time] {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    text-align: left;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  .card-head h2 { margin: 0; }
  .staff-menu-btn {
    background: #f1f5f4;
    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 48px;
    height: 32px;
    padding: 0 10px;
    font-size: 16px;
    line-height: 1;
    white-space: nowrap;
    color: var(--text-muted);
    cursor: pointer;
  }
  .staff-menu-btn:active { background: #e4e7ec; }
  .staff-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .staff-modal-overlay.open { display: flex; }
  .staff-modal-box {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  .staff-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .staff-modal-header h3 { margin: 0; font-size: 16px; color: var(--accent-dark); }
  .staff-modal-close {
    background: none;
    border: none;
    font-size: 24px;
    line-height: 1;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 4px;
  }
  .staff-list-area {
    overflow-y: auto;
    flex: 1;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    min-height: 80px;
  }
  .staff-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 2px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .staff-row:last-child { border-bottom: none; }
  .staff-row-name { flex: 1; }
  .staff-row button, .staff-add-area .btn-primary {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #f7f7f7;
    color: var(--text);
    cursor: pointer;
  }
  .staff-row .staff-del-btn { color: var(--danger); border-color: #e8c7c1; }
  .staff-edit-row { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .staff-edit-row input {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .staff-add-area label { margin: 6px 0 4px; }
  .staff-add-area input { margin-bottom: 4px; }
  .staff-add-area .btn-primary {
    width: 100%;
    font-size: 14px;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    margin-top: 4px;
  }
  .auto-field strong { color: var(--text); }
  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
  .link-btn {
    display: block;
    background: none;
    border: none;
    color: var(--accent-dark);
    font-size: 13px;
    text-decoration: underline;
    padding: 6px 0 2px;
    cursor: pointer;
    text-align: left;
  }
  .status-msg { margin-top: 10px; font-size: 14px; text-align: center; }
  .status-msg.ok { color: var(--ok); }
  .status-msg.err { color: var(--danger); }
  details.server-setting { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  details.server-setting input { margin-top: 6px; }
  .test-badge {
    display: inline-block;
    background: #fff3cd;
    color: #8a6d1f;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 6px;
  }
</style>
</head>
<body>
<header>
  <a class="back-link" href="../">← トップに戻る</a>
  <h1>収集日報の入力<span class="test-badge">テスト機能</span></h1>
  <p>市への報告書用データを入力して送信します（既存のタップ記録アプリとは別ページです）</p>
</header>
<main>
  <div class="card">
    <h2>車両NO・収集地区</h2>
    <div class="auto-field" id="dateField">読み込み中...</div>

    <label>車両NO（自動で入ります。違う場合は書き換えてください）</label>
    <input type="text" inputmode="numeric" id="vehicleInput" placeholder="例：0317">

    <button type="button" class="link-btn" id="toggleVehicle2Btn">＋ 車両故障などで途中から別の車両に交代した場合はこちら</button>
    <div id="vehicle2Wrap" style="display:none;">
      <label>交代後の車両NO</label>
      <input type="text" inputmode="numeric" id="vehicle2Input" placeholder="例：0450">
    </div>

    <label>収集地区</label>
    <input type="text" id="district" placeholder="例：新富　城山">

    <label>収集時間 開始</label>
    <div class="auto-field">8:30（固定）</div>

    <label>帰社時間 終了</label>
    <div class="auto-field time-wrap">
      <input type="time" id="timeEndInput">
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>搭乗者</h2>
      <button type="button" class="staff-menu-btn" id="staffMenuBtn">・・・</button>
    </div>
    <label>運転手</label>
    <select id="driverSelect"></select>

    <label>助手</label>
    <select id="helperSelect"></select>
  </div>

  <div class="card">
    <h2>可燃収集量（kg）</h2>
    <div class="row5">
      <div><label>1回目</label><input type="number" inputmode="decimal" id="b1"></div>
      <div><label>2回目</label><input type="number" inputmode="decimal" id="b2"></div>
      <div><label>3回目</label><input type="number" inputmode="decimal" id="b3"></div>
      <div><label>4回目</label><input type="number" inputmode="decimal" id="b4"></div>
      <div><label>5回目</label><input type="number" inputmode="decimal" id="b5"></div>
    </div>
  </div>

  <div class="card">
    <h2>資源ごみ収集量（kg）</h2>
    <div class="row3">
      <div><label>ペットボトル</label><input type="number" inputmode="decimal" id="petBottle"></div>
      <div><label>ダンボール</label><input type="number" inputmode="decimal" id="cardboardKg"></div>
      <div><label>容プラ</label><input type="number" inputmode="decimal" id="youpura"></div>
    </div>
  </div>

  <div class="card">
    <h2>走行距離</h2>
    <div class="row2">
      <div><label>走行距離 開始（km）</label><input type="number" inputmode="decimal" id="odoStart"></div>
      <div><label>走行距離 終了（km）</label><input type="number" inputmode="decimal" id="odoEnd"></div>
    </div>
  </div>

  <div class="card">
    <button class="btn-primary" id="submitBtn">この内容を送信する</button>
    <div class="status-msg" id="statusMsg"></div>
    <details class="server-setting">
      <summary>送信先設定</summary>
      <input type="text" id="serverAddrInput" placeholder="例：https://192.168.11.34:8788">
    </details>
  </div>
</main>

<div class="staff-modal-overlay" id="staffModalOverlay">
  <div class="staff-modal-box">
    <div class="staff-modal-header">
      <h3>搭乗者リストの編集</h3>
      <button type="button" class="staff-modal-close" id="staffModalCloseBtn">×</button>
    </div>
    <div class="staff-list-area" id="staffListArea">読み込み中...</div>
    <div class="staff-add-area">
      <label>新しく追加する氏名（姓 名）</label>
      <input type="text" id="newStaffName" placeholder="例：山田 太郎">
      <label>ふりがな（ひらがな、並び順に使います）</label>
      <input type="text" id="newStaffReading" placeholder="例：やまだたろう">
      <button type="button" class="btn-primary" id="addStaffBtn">追加する</button>
      <div class="status-msg" id="staffModalMsg"></div>
    </div>
  </div>
</div>

<script>
const COURSES = [
  { id: "murasaki-getsumoku", name: "紫コース（月・木）", color: "紫" },
  { id: "murasaki-kakin", name: "紫コース（火・金）", color: "紫" },
  { id: "murasaki-pet1", name: "紫コース（ペット・ダンボール①）", color: "紫" },
  { id: "murasaki-pet2", name: "紫コース（ペット・ダンボール②）", color: "紫" },
  { id: "midori-getsumoku", name: "緑コース（月・木）", color: "緑" },
  { id: "midori-kakin", name: "緑コース（火・金）", color: "緑" },
  { id: "midori-pet1", name: "緑コース（ペット・ダンボール①）", color: "緑" },
  { id: "midori-pet2", name: "緑コース（ペット・ダンボール②）", color: "緑" },
  { id: "kiiro-getsumoku", name: "黄コース（月・木）", color: "黄" },
  { id: "kiiro-kakin", name: "黄コース（火・金）", color: "黄" },
  { id: "kiiro-kanada", name: "黄コース（金田地区）", color: "黄" },
  { id: "kiiro-pet1", name: "黄コース（ペット・ダンボール①）", color: "黄" },
  { id: "kiiro-pet2", name: "黄コース（ペット・ダンボール②）", color: "黄" },
  { id: "ao-getsumoku", name: "青コース（月・木）", color: "青" },
  { id: "ao-kakin", name: "青コース（火・金）", color: "青" },
  { id: "ao-pet1", name: "青コース（ペット・ダンボール①）", color: "青" },
  { id: "ao-pet2", name: "青コース（ペット・ダンボール②）", color: "青" },
  { id: "kuro-getsumoku", name: "黒コース（月・木）", color: "黒" },
  { id: "kuro-kakin", name: "黒コース（火・金）", color: "黒" },
  { id: "kuro-pet1", name: "黒コース（ペット・ダンボール①）", color: "黒" },
  { id: "kuro-pet2", name: "黒コース（ペット・ダンボール②）", color: "黒" },
  { id: "pink-getsumoku", name: "ピンクコース（月・木）", color: "ピンク" },
  { id: "pink-kakin", name: "ピンクコース（火・金）", color: "ピンク" },
  { id: "pink-pet1", name: "ピンクコース（ペット・ダンボール①）", color: "ピンク" },
  { id: "pink-pet2", name: "ピンクコース（ペット・ダンボール②）", color: "ピンク" },
  { id: "youpura_murasaki-kanada", name: "容プラ(紫)コース（金田地区）", color: "容プラ(紫)" },
  { id: "youpura_murasaki-sakuyama", name: "容プラ(紫)コース（佐久山・親園・野崎）", color: "容プラ(紫)" },
  { id: "youpura_murasaki-nishi", name: "容プラ(紫)コース（西地区）", color: "容プラ(紫)" },
  { id: "youpura_murasaki-higashi", name: "容プラ(紫)コース（東地区）", color: "容プラ(紫)" },
  { id: "youpura_kiiro-kanada", name: "容プラ(黄)コース（金田地区）", color: "容プラ(黄)" },
  { id: "youpura_kiiro-sakuyama", name: "容プラ(黄)コース（佐久山・親園・野崎）", color: "容プラ(黄)" },
  { id: "youpura_kiiro-nishi", name: "容プラ(黄)コース（西地区）", color: "容プラ(黄)" },
  { id: "youpura_kiiro-higashi", name: "容プラ(黄)コース（東地区）", color: "容プラ(黄)" }
];

const STAFF_NAMES = [
  "生澤 政雄", "磯 浩之", "伊藤 隆",
  "大島 政夫", "大野 知昭", "大宮 泰彦", "大森 憲司", "大森 司", "大森 弘", "小野 孝二", "小山田 雅紀",
  "金川 貴広", "金澤 信一", "金子 敏雄",
  "君島 敬一", "君島 義美",
  "郡司 浩",
  "小島 和夫", "小白井 正", "小林 一也", "小林 忠男", "小森 公乃",
  "佐々木 晃",
  "塩田 義和",
  "諏合 仁", "諏合 斉",
  "相馬 有紀",
  "高橋 義幸",
  "坪井 利幸",
  "益子 泉",
  "室井 賢治", "室井 正",
  "渡辺 晋也", "渡邊 浩克"
];

function pad2(n){ return String(n).padStart(2, "0"); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

let STAFF_LIST = STAFF_NAMES.map(name => ({ name, reading: "" }));

function buildStaffSelects(){
  [document.getElementById("driverSelect"), document.getElementById("helperSelect")].forEach(sel => {
    const prevValue = sel.value;
    sel.innerHTML = "";
    const blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "（選択してください）";
    sel.appendChild(blank);
    STAFF_LIST.forEach(person => {
      const opt = document.createElement("option");
      opt.value = person.name;
      opt.textContent = person.name;
      sel.appendChild(opt);
    });
    if (STAFF_LIST.some(p => p.name === prevValue)) sel.value = prevValue;
  });
}

async function fetchStaffList(){
  const server = getAdminServer();
  if (!server) return null;
  try {
    const res = await fetch(server.replace(/\/$/, "") + "/api/staff-list", { cache: "no-store" });
    const data = await res.json();
    if (data.ok && Array.isArray(data.staff)) return data.staff;
  } catch (e) {}
  return null;
}

async function refreshStaffList(){
  const list = await fetchStaffList();
  if (list) {
    STAFF_LIST = list;
    buildStaffSelects();
  }
}

async function callStaffApi(path, body){
  const server = getAdminServer();
  const msg = document.getElementById("staffModalMsg");
  if (!server) {
    msg.className = "status-msg err";
    msg.textContent = "送信先設定（事務所PCのアドレス）を先に設定してください。";
    return null;
  }
  try {
    const res = await fetch(server.replace(/\/$/, "") + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.error) {
      msg.className = "status-msg err";
      msg.textContent = data.error;
      return null;
    }
    return data;
  } catch (e) {
    msg.className = "status-msg err";
    msg.textContent = "事務所PCに接続できませんでした。送信先設定とWi-Fi接続を確認してください。";
    return null;
  }
}

function renderStaffModalList(){
  const area = document.getElementById("staffListArea");
  area.innerHTML = "";
  if (STAFF_LIST.length === 0) {
    area.textContent = "登録されている搭乗者がいません。";
    return;
  }
  STAFF_LIST.forEach(person => {
    const row = document.createElement("div");
    row.className = "staff-row";
    const nameSpan = document.createElement("span");
    nameSpan.className = "staff-row-name";
    nameSpan.textContent = person.name;
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.textContent = "編集";
    editBtn.addEventListener("click", () => startEditStaffRow(row, person));
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "staff-del-btn";
    delBtn.textContent = "削除";
    delBtn.addEventListener("click", () => deleteStaffMember(person));
    row.appendChild(nameSpan);
    row.appendChild(editBtn);
    row.appendChild(delBtn);
    area.appendChild(row);
  });
}

function startEditStaffRow(row, person){
  row.innerHTML = "";
  const editWrap = document.createElement("div");
  editWrap.className = "staff-edit-row";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.value = person.name;
  const readingInput = document.createElement("input");
  readingInput.type = "text";
  readingInput.value = person.reading || "";
  readingInput.placeholder = "ふりがな（ひらがな）";
  editWrap.appendChild(nameInput);
  editWrap.appendChild(readingInput);

  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.textContent = "保存";
  saveBtn.addEventListener("click", () => saveStaffEdit(person.name, nameInput.value.trim(), readingInput.value.trim()));

  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.textContent = "取消";
  cancelBtn.addEventListener("click", renderStaffModalList);

  row.appendChild(editWrap);
  row.appendChild(saveBtn);
  row.appendChild(cancelBtn);
}

async function saveStaffEdit(oldName, newName, newReading){
  const msg = document.getElementById("staffModalMsg");
  if (!newName || !newReading) {
    msg.className = "status-msg err";
    msg.textContent = "氏名とふりがなを入力してください。";
    return;
  }
  const data = await callStaffApi("/api/staff-edit", { oldName, newName, newReading });
  if (data) {
    STAFF_LIST = data.staff;
    msg.className = "status-msg ok";
    msg.textContent = "更新しました。";
    renderStaffModalList();
    buildStaffSelects();
  }
}

async function deleteStaffMember(person){
  if (!confirm(person.name + " を削除しますか？")) return;
  const data = await callStaffApi("/api/staff-delete", { name: person.name });
  if (data) {
    STAFF_LIST = data.staff;
    document.getElementById("staffModalMsg").className = "status-msg ok";
    document.getElementById("staffModalMsg").textContent = "削除しました。";
    renderStaffModalList();
    buildStaffSelects();
  }
}

async function addStaffMember(){
  const nameInput = document.getElementById("newStaffName");
  const readingInput = document.getElementById("newStaffReading");
  const name = nameInput.value.trim();
  const reading = readingInput.value.trim();
  const msg = document.getElementById("staffModalMsg");
  if (!name || !reading) {
    msg.className = "status-msg err";
    msg.textContent = "氏名とふりがなを入力してください。";
    return;
  }
  const data = await callStaffApi("/api/staff-add", { name, reading });
  if (data) {
    STAFF_LIST = data.staff;
    nameInput.value = "";
    readingInput.value = "";
    msg.className = "status-msg ok";
    msg.textContent = "追加しました。";
    renderStaffModalList();
    buildStaffSelects();
  }
}

function openStaffModal(){
  document.getElementById("staffModalMsg").className = "status-msg";
  document.getElementById("staffModalMsg").textContent = "";
  renderStaffModalList();
  document.getElementById("staffModalOverlay").classList.add("open");
}
function closeStaffModal(){
  document.getElementById("staffModalOverlay").classList.remove("open");
}

function findCourse(id){
  return COURSES.find(c => c.id === id);
}

function updateAutoField(){
  const vehicleInput = document.getElementById("vehicleInput");
  if (!CURRENT_COURSE) { return; }
  const courseId = CURRENT_COURSE.id;
  const date = CURRENT_DATE;

  let vehicle = "";
  try {
    vehicle = localStorage.getItem("gomi_veh_" + courseId + "_" + date) || "";
  } catch (e) {}

  if (vehicle && !vehicleInput.value) { vehicleInput.value = vehicle; }
}

function getAdminServer(){
  try { return localStorage.getItem("gomi_admin_server") || ""; } catch (e) { return ""; }
}
function setAdminServer(v){
  try { localStorage.setItem("gomi_admin_server", v); } catch (e) {}
}

function initServerField(){
  const input = document.getElementById("serverAddrInput");
  input.value = getAdminServer();
  input.addEventListener("change", () => setAdminServer(input.value.trim()));
}

async function submitReport(){
  const statusMsg = document.getElementById("statusMsg");
  const course = CURRENT_COURSE;
  const date = CURRENT_DATE;
  const vehicleNo = document.getElementById("vehicleInput").value.trim();
  const vehicleNo2 = document.getElementById("vehicle2Input").value.trim();
  const server = getAdminServer();

  if (!vehicleNo) {
    statusMsg.className = "status-msg err";
    statusMsg.textContent = "車両NOを入力してください。";
    return;
  }
  if (!server) {
    statusMsg.className = "status-msg err";
    statusMsg.textContent = "送信先設定（事務所PCのアドレス）を入力してください。";
    return;
  }

  const burnable = [
    document.getElementById("b1").value,
    document.getElementById("b2").value,
    document.getElementById("b3").value,
    document.getElementById("b4").value,
    document.getElementById("b5").value
  ];
  const count = burnable.filter(v => v !== "" && v !== null).length;

  const payload = {
    date: date,
    courseId: course ? course.id : "",
    courseName: course ? course.name : "",
    color: course ? course.color : "",
    vehicleNo: vehicleNo,
    vehicleNo2: vehicleNo2,
    driver: document.getElementById("driverSelect").value,
    helper: document.getElementById("helperSelect").value,
    burnable: burnable,
    petBottle: document.getElementById("petBottle").value,
    cardboardKg: document.getElementById("cardboardKg").value,
    youpura: document.getElementById("youpura").value,
    district: document.getElementById("district").value,
    odoStart: document.getElementById("odoStart").value,
    odoEnd: document.getElementById("odoEnd").value,
    timeStart: "8:30",
    timeEnd: document.getElementById("timeEndInput").value,
    count: count
  };

  statusMsg.className = "status-msg";
  statusMsg.textContent = "送信中...";
  try {
    const res = await fetch(server.replace(/\/$/, "") + "/api/nippou-submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.ok) {
      statusMsg.className = "status-msg ok";
      statusMsg.textContent = "送信しました！";
    } else {
      statusMsg.className = "status-msg err";
      statusMsg.textContent = "送信に失敗しました：" + (data.error || "不明なエラー");
    }
  } catch (e) {
    statusMsg.className = "status-msg err";
    statusMsg.textContent = "事務所PCに接続できませんでした。送信先設定とWi-Fi接続を確認してください。";
  }
}

buildStaffSelects();
initServerField();
refreshStaffList();

document.getElementById("staffMenuBtn").addEventListener("click", openStaffModal);
document.getElementById("staffModalCloseBtn").addEventListener("click", closeStaffModal);
document.getElementById("staffModalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "staffModalOverlay") closeStaffModal();
});
document.getElementById("addStaffBtn").addEventListener("click", addStaffMember);

const CURRENT_DATE = todayStr();
const WEEKDAYS = ["日","月","火","水","木","金","土"];
const presetCourseId = new URLSearchParams(location.search).get("course");
let CURRENT_COURSE = presetCourseId ? findCourse(presetCourseId) : null;

const dateField = document.getElementById("dateField");
const weekday = WEEKDAYS[new Date(CURRENT_DATE + "T00:00:00").getDay()];
dateField.innerHTML = "<strong>" + CURRENT_DATE.replace(/-/g, "/") + "（" + weekday + "）</strong>";

document.getElementById("toggleVehicle2Btn").addEventListener("click", () => {
  const wrap = document.getElementById("vehicle2Wrap");
  const btn = document.getElementById("toggleVehicle2Btn");
  const showing = wrap.style.display !== "none";
  wrap.style.display = showing ? "none" : "block";
  btn.textContent = showing
    ? "＋ 車両故障などで途中から別の車両に交代した場合はこちら"
    : "－ 交代車両の入力を閉じる";
});

document.getElementById("submitBtn").addEventListener("click", submitReport);
updateAutoField();
</script>
