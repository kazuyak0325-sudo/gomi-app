<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>紫コース</title>
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#4b2e83">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px;
  }
  a.back {
    display: inline-block;
    margin-bottom: 12px;
    font-size: 13px;
    color: #555;
    text-decoration: none;
    border-bottom: 1px solid #999;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 16px;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 480px;
    margin: 0 auto;
  }
  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px 8px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    min-height: 90px;
  }
  a.card.disabled {
    opacity: 0.55;
    pointer-events: none;
  }
  .card small {
    font-weight: 400;
    font-size: 11px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<a class="back" href="../">← コース選択に戻る</a>
<h1>紫コース：収集日程を選んでください</h1>
<div class="grid">
  <a class="card" style="background:#4b2e83" href="getsumoku/">月・木</a>
  <a class="card disabled" style="background:#4b2e83" href="kakin/">火・金<small>準備中</small></a>
  <a class="card disabled" style="background:#4b2e83" href="pet1/">ペット①<small>準備中</small></a>
  <a class="card disabled" style="background:#4b2e83" href="pet2/">ペット②<small>準備中</small></a>
</div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
